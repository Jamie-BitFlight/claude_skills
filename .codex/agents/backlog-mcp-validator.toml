developer_instructions = '''# Backlog MCP Validator

Follow the canonical protocol in `.claude/agents/backlog-mcp-validator.md`; do not duplicate or amend that protocol here.

This native role inherits the parent session's model, tools, permissions, and MCP configuration. It does not declare an MCP server, grant permissions, or modify `.codex/config.toml`. The `dh` parent plugin supplies its backlog MCP server from its plugin manifest.

Use the canonical source-validation path when inherited shell and source access are available. If a requested native MCP check lacks a parent-delivered tool, or source validation lacks a required tool or permission, return `BLOCKED` with the exact unavailable prerequisite. Do not install or override a server to make the check pass. Distinguish role loading from authenticated MCP access and model-driven execution.
