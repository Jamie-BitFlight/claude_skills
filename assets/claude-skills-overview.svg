<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Claude Skills — practical engineering workflows for coding agents</title>
<desc id="desc">A restrained editorial overview showing user goals flowing through skills, agents, hooks, and MCP tools into reliable software, with four highlighted systems: Python Engineering, Development Harness, Plugin Creator, and Process Siren.</desc>
<defs>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .ink{fill:#18201d}.muted{fill:#65716c}.hair{stroke:#d7ded9;stroke-width:1.2;fill:none}
    .card{fill:#fbfcfa;stroke:#d7ded9;stroke-width:1.2}.soft{fill:#f3f6f2}
    .accent{fill:#397d61}.accentLine{stroke:#397d61;stroke-width:2;fill:none}
    .blue{fill:#426d9b}.orange{fill:#b66b39}.violet{fill:#735b9e}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397d61"/></marker>
</defs>
<rect width="1200" height="520" rx="18" fill="#f7f8f5"/>
<rect x="24" y="24" width="1152" height="218" rx="14" class="card"/>

<g class="sans">
  <text x="62" y="78" class="ink" font-size="34" font-weight="700">Claude Skills</text>
  <text x="62" y="108" class="muted" font-size="17">Practical, composable engineering workflows for coding agents</text>
  <line x1="62" y1="128" x2="104" y2="128" class="accentLine"/>
  <text x="62" y="163" class="muted" font-size="14">Repository-aware defaults.</text>
  <text x="62" y="184" class="muted" font-size="14">Evidence before action.</text>
  <text x="62" y="205" class="muted" font-size="14">Specialists when the problem deserves them.</text>

  <text x="360" y="61" class="muted" font-size="11" letter-spacing="1.5">YOUR GOAL</text>
  <rect x="348" y="78" width="142" height="122" rx="9" class="soft"/>
  <text x="369" y="108" class="ink" font-size="13">Write better code</text>
  <text x="369" y="135" class="ink" font-size="13">Reduce toil</text>
  <text x="369" y="162" class="ink" font-size="13">Improve systems</text>
  <text x="369" y="189" class="ink" font-size="13">Ship reliably</text>

  <path d="M490 139 C525 139 528 139 548 139" class="accentLine" marker-end="url(#arrow)"/>

  <text x="560" y="61" class="muted" font-size="11" letter-spacing="1.5">COMPOSABLE CAPABILITIES</text>
  <rect x="548" y="78" width="184" height="28" rx="6" fill="#e8f1ec" stroke="#b8cfc2"/><text x="568" y="97" class="ink" font-size="12">Skills</text>
  <rect x="548" y="111" width="184" height="28" rx="6" fill="#eef2f6" stroke="#c5d1dd"/><text x="568" y="130" class="ink" font-size="12">Specialist agents</text>
  <rect x="548" y="144" width="184" height="28" rx="6" fill="#f4efe9" stroke="#ddcdbd"/><text x="568" y="163" class="ink" font-size="12">Hooks</text>
  <rect x="548" y="177" width="184" height="28" rx="6" fill="#f0edf5" stroke="#cec4dc"/><text x="568" y="196" class="ink" font-size="12">MCP tools</text>

  <path d="M732 139 C767 139 770 139 790 139" class="accentLine" marker-end="url(#arrow)"/>

  <text x="802" y="61" class="muted" font-size="11" letter-spacing="1.5">OUTCOME</text>
  <rect x="790" y="78" width="172" height="122" rx="9" class="soft"/>
  <text x="812" y="108" class="ink" font-size="13">Traced decisions</text>
  <text x="812" y="135" class="ink" font-size="13">Verified changes</text>
  <text x="812" y="162" class="ink" font-size="13">Reusable workflows</text>
  <text x="812" y="189" class="ink" font-size="13">Less maintenance</text>

  <path d="M962 139 C997 139 1000 139 1020 139" class="accentLine" marker-end="url(#arrow)"/>
  <rect x="1020" y="99" width="116" height="80" rx="12" fill="#edf5f0" stroke="#9fc2af"/>
  <path d="M1057 126 l10 10 24-28" fill="none" stroke="#397d61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1078" y="159" text-anchor="middle" class="ink" font-size="13" font-weight="600">Better software</text>
</g>

<g class="sans">
  <text x="28" y="279" class="muted" font-size="11" letter-spacing="1.7">START WITH THESE</text>

  <rect x="24" y="294" width="276" height="176" rx="12" class="card"/>
  <circle cx="56" cy="329" r="12" class="blue"/>
  <text x="80" y="334" class="ink" font-size="17" font-weight="650">Python Engineering</text>
  <text x="44" y="365" class="muted" font-size="13">Opinionated defaults, independent</text>
  <text x="44" y="384" class="muted" font-size="13">design challenge, testing and review.</text>
  <line x1="44" y1="407" x2="278" y2="407" class="hair"/>
  <text x="44" y="431" class="ink" font-size="12">orchestrate → implement → verify</text>
  <text x="44" y="451" class="accent" font-size="12">quality audit → modernize / delete</text>

  <rect x="316" y="294" width="276" height="176" rx="12" class="card"/>
  <circle cx="348" cy="329" r="12" class="accent"/>
  <text x="372" y="334" class="ink" font-size="17" font-weight="650">Development Harness</text>
  <text x="336" y="365" class="muted" font-size="13">Discovery through verified delivery</text>
  <text x="336" y="384" class="muted" font-size="13">with explicit artifacts and routing.</text>
  <line x1="336" y1="407" x2="570" y2="407" class="hair"/>
  <text x="336" y="431" class="ink" font-size="12">discover → plan → execute</text>
  <text x="336" y="451" class="accent" font-size="12">review → verify</text>

  <rect x="608" y="294" width="276" height="176" rx="12" class="card"/>
  <circle cx="640" cy="329" r="12" class="violet"/>
  <text x="664" y="334" class="ink" font-size="17" font-weight="650">Plugin Creator</text>
  <text x="628" y="365" class="muted" font-size="13">Create, evaluate, tighten and validate</text>
  <text x="628" y="384" class="muted" font-size="13">skills, agents, hooks and plugins.</text>
  <line x1="628" y1="407" x2="862" y2="407" class="hair"/>
  <text x="628" y="431" class="ink" font-size="12">research → design → build</text>
  <text x="628" y="451" class="accent" font-size="12">evaluate → tighten → validate</text>

  <rect x="900" y="294" width="276" height="176" rx="12" class="card"/>
  <circle cx="932" cy="329" r="12" class="orange"/>
  <text x="956" y="334" class="ink" font-size="17" font-weight="650">Process Siren</text>
  <text x="920" y="365" class="muted" font-size="13">Understand and improve processes</text>
  <text x="920" y="384" class="muted" font-size="13">before representing them concisely.</text>
  <line x1="920" y1="407" x2="1154" y2="407" class="hair"/>
  <text x="920" y="431" class="ink" font-size="12">model → challenge → validate</text>
  <text x="920" y="451" class="accent" font-size="12">represent only when useful</text>

  <text x="600" y="501" text-anchor="middle" class="muted" font-size="12">Explore → specialize → verify → improve</text>
</g>
</svg>