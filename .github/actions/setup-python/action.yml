name: Setup Python
description: Checkout repo and set up uv + Python 3.11 with caching

inputs:
  fetch-depth:
    description: Git history depth; use 0 for immutable base/head comparisons
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.11"
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"
        cache-python: true
