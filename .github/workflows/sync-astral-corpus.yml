# Weekly astral corpus sync: uv's changelog stub, and the uv/ruff/ty docs mirror.
#
# sync-uv-changelog: runs sync_uv_releases.py, which queries the GitHub
# Releases API for astral-sh/uv and rewrites the "## Version Information"
# section of references/uv/README.md. Opens a PR when that section changes.
#
# sync-docs: runs sync_astral_docs.py, which downloads each tool's repo zip,
# mirrors its docs/ subtree into references/<tool>/docs/, and regenerates
# the "## Documentation Index" section of references/<tool>/README.md. Opens
# a PR when the corpus changes. This is the actual reference content agents
# read offline — distinct from the changelog stub above.
#
# rwr:user-docs-to-ai-skill is deliberately NOT used for either job: its
# output contract is hardcoded to plugins/<x>/skills/<y>/, it caps at 6
# themes, and it clones sources into .claude/worktrees/, colliding with
# Claude Code's own worktree directory. It's reserved for manual, reviewed,
# one-shot work — never a scheduled job.

name: Sync Astral Corpus

on:
  schedule:
    # Sunday 06:00 UTC — after the weekly quiet period, ahead of the work week
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: sync-astral-corpus
  cancel-in-progress: false

permissions: {}

jobs:
  sync-uv-changelog:
    name: Sync uv changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Run uv changelog sync
        run: |
          uv run -q --locked \
            plugins/python-engineering/skills/python3-tools/scripts/sync_uv_releases.py

      - name: Open PR if the changelog changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(python3-tools): sync uv changelog"
          title: "chore(python3-tools): sync uv changelog"
          body: |
            Automated weekly sync of the uv release changelog into
            `plugins/python-engineering/skills/python3-tools/references/uv/README.md`
            by `sync_uv_releases.py`, run from `.github/workflows/sync-astral-corpus.yml`.

            This refreshes the changelog stamp only — it does not regenerate the
            reference corpus. Review the diff before merging.
          branch: sync-astral-corpus/uv-changelog
          delete-branch: true
          add-paths: |
            plugins/python-engineering/skills/python3-tools/references/uv/README.md

  sync-docs:
    name: Sync uv/ruff/ty docs corpus
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Run docs corpus sync
        run: |
          uv run -q --locked \
            plugins/python-engineering/skills/python3-tools/scripts/sync_astral_docs.py \
            uv ruff ty

      - name: Open PR if the corpus changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(python3-tools): sync uv/ruff/ty docs corpus"
          title: "chore(python3-tools): sync uv/ruff/ty docs corpus"
          body: |
            Automated weekly mirror of `astral-sh/{uv,ruff,ty}`'s `docs/` trees into
            `plugins/python-engineering/skills/python3-tools/references/{uv,ruff,ty}/docs/`
            by `sync_astral_docs.py`, run from `.github/workflows/sync-astral-corpus.yml`.
            Also regenerates each archive's Documentation Index.

            Review the diff before merging — grooming (admonitions, tabs) is
            mechanical and can occasionally misrender an edge case.
          branch: sync-astral-corpus/docs
          delete-branch: true
          add-paths: |
            plugins/python-engineering/skills/python3-tools/references/uv/docs/**
            plugins/python-engineering/skills/python3-tools/references/uv/README.md
            plugins/python-engineering/skills/python3-tools/references/ruff/docs/**
            plugins/python-engineering/skills/python3-tools/references/ruff/README.md
            plugins/python-engineering/skills/python3-tools/references/ty/docs/**
            plugins/python-engineering/skills/python3-tools/references/ty/README.md
