# Weekly astral corpus changelog sync.
#
# What this DOES: runs sync_uv_releases.py, which queries the GitHub Releases
# API for astral-sh/uv and rewrites the "## Version Information" section of
# plugins/python-engineering/skills/python3-tools/references/uv/README.md.
# Opens a PR when that section changes; no-ops cleanly when it doesn't.
#
# What this does NOT do: it does not regenerate the reference corpus itself
# (cli_reference.md, configuration.md, etc.) — no automated tooling for that
# exists in this repo today. rwr:user-docs-to-ai-skill
# is deliberately NOT used here: its output contract is hardcoded to
# plugins/<x>/skills/<y>/, it caps at 6 themes (the ty corpus has 9), and it
# clones sources into .claude/worktrees/, colliding with Claude Code's own
# worktree directory. rwr is reserved for a manual, reviewed, one-shot
# regeneration — never this scheduled job.
#
# ty has no automated changelog sync — sync_ty_releases.py was deleted as dead
# code (its target section never existed in ty/SKILL.md). See
# references/ty/README.md for the documented gap.

name: Sync Astral Corpus

on:
  schedule:
    # Sunday 06:00 UTC — after the weekly quiet period, ahead of the work week
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: sync-astral-corpus
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Sync uv changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Run uv changelog sync
        run: |
          uv run -q --locked \
            plugins/python-engineering/skills/python3-tools/scripts/sync_uv_releases.py

      - name: Open PR if the archive changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(python3-tools): sync uv changelog"
          title: "chore(python3-tools): sync uv changelog"
          body: |
            Automated weekly sync of the uv release changelog into
            `plugins/python-engineering/skills/python3-tools/references/uv/README.md`
            by `sync_uv_releases.py`, run from `.github/workflows/sync-astral-corpus.yml`.

            This refreshes the changelog stamp only — it does not regenerate the
            reference corpus. Review the diff before merging.
          branch: sync-astral-corpus/uv-changelog
          delete-branch: true
          add-paths: |
            plugins/python-engineering/skills/python3-tools/references/uv/README.md
