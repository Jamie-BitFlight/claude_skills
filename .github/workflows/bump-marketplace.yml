name: Bump Plugin and Marketplace Versions

# Patch versions are assigned here, once, after changes land on main. The
# pre-commit hook never bumps. `repair` bumps every plugin whose files
# changed after its last version bump, so one run covers any number of merged
# PRs, and rerunning after the bump commit changes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One run at a time. GitHub keeps one pending run per group and cancels an
# older pending run when a newer one queues; each run starts from the newest
# main and bumps everything unversioned, so the surviving run covers them all.
concurrency:
  group: bump-marketplace
  cancel-in-progress: false

permissions: {}

jobs:
  bump:
    name: Bump changed plugins and sync marketplace.json
    runs-on: ubuntu-latest
    # Main only. The version commit's own push is NOT skipped: its run may be
    # the pending run that replaced a racing merge's run, and must process that
    # merge. With nothing left to bump it exits without pushing, ending the loop.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Require versioning app credential
        env:
          CLIENT_ID: ${{ vars.VERSIONER_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.VERSIONER_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$CLIENT_ID" || -z "$PRIVATE_KEY" ]]; then
            echo "::error::Set variable VERSIONER_APP_CLIENT_ID and secret VERSIONER_APP_PRIVATE_KEY for a GitHub App on the main ruleset bypass list; see docs/marketplace-versioning.md"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      # `base` is the last version commit (the pre-merge revision before the
      # first one exists), so the marketplace diff covers every change merged
      # since versions were last assigned, including plugins added by a merge
      # and changes from pushes whose own queued run was superseded.
      - name: Record starting revision
        id: start
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          base="$(git log -1 --format=%H --grep='^chore(plugins): assign plugin versions$')"
          echo "base=${base:-$(git rev-parse HEAD^)}" >> "$GITHUB_OUTPUT"

      - name: Bump plugins changed since their last version bump
        uses: Jamie-BitFlight/agent-marketplace-versioner@4726d7c64b50e7d71ec3d7352afa54f9fd584a2d
        with:
          command: repair

      - name: Commit plugin versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -q -m 'chore(plugins): assign plugin versions'
          fi

      # Bumps the catalog version when any plugin directory changed since `base`,
      # or when catalog membership drifted from plugins/. The pinned versioner
      # compares only plugins that still exist, so a removal alone does not bump it.
      - name: Synchronize marketplace
        uses: Jamie-BitFlight/agent-marketplace-versioner@4726d7c64b50e7d71ec3d7352afa54f9fd584a2d
        with:
          command: sync
          marketplace: 'true'
          base-ref: ${{ steps.start.outputs.base }}
          head-ref: HEAD

      # Minted last, so no earlier step runs while a write token exists.
      - name: Mint versioning app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.VERSIONER_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSIONER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push version commit to main
        env:
          START: ${{ steps.start.outputs.sha }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add -u
          if ! git diff --cached --quiet; then
            if [[ "$(git rev-parse HEAD)" == "$START" ]]; then
              git commit -q -m 'chore(plugins): assign plugin versions'
            else
              git commit -q --amend --no-edit
            fi
          fi
          if [[ "$(git rev-parse HEAD)" == "$START" ]]; then
            echo "No plugin or marketplace version changes needed."
            exit 0
          fi
          git show --stat HEAD
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A merge can land between checkout and push; replay the bump onto it.
          for attempt in 1 2 3; do
            if git push "$remote" HEAD:main; then
              exit 0
            fi
            echo "::warning::Push attempt $attempt rejected; rebasing onto current main"
            git pull --rebase "$remote" main
          done
          echo "::error::Could not push the version commit after 3 attempts"
          exit 1
