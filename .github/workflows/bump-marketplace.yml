name: Bump Plugin and Marketplace Versions

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  workflow_dispatch: {}

concurrency:
  group: bump-marketplace
  cancel-in-progress: false

permissions: {}

jobs:
  bump:
    name: Repair plugin versions and sync marketplace.json
    runs-on: ubuntu-latest
    # This workflow owns the repair title below; preserve it when merging to prevent another repair.
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore(marketplace): repair versions and synchronize catalog')"
    permissions:
      contents: read
    steps:
      - name: Require repair PR credential
        env:
          VERSIONER_PR_TOKEN: ${{ secrets.VERSIONER_PR_TOKEN }}
        run: |
          if [[ -z "$VERSIONER_PR_TOKEN" ]]; then
            echo "::error::Set VERSIONER_PR_TOKEN with contents:write and pull-requests:write; see docs/marketplace-versioning.md"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Repair version collisions
        uses: Jamie-BitFlight/agent-marketplace-versioner@7d2aacc06b428227ea37568cf3762d9956a7ea99
        with:
          command: repair

      - name: Synchronize marketplace
        uses: Jamie-BitFlight/agent-marketplace-versioner@7d2aacc06b428227ea37568cf3762d9956a7ea99
        with:
          command: sync
          marketplace: 'true'

      - name: Open or update repair PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.VERSIONER_PR_TOKEN }}
          branch: automation/marketplace-version-repair
          base: main
          add-paths: |
            .claude-plugin/marketplace.json
            plugins/*/.claude-plugin/plugin.json
            plugins/*/.codex-plugin/plugin.json
            plugins/*/.cursor-plugin/plugin.json
          commit-message: 'chore(marketplace): repair versions and synchronize catalog'
          title: 'chore(marketplace): repair versions and synchronize catalog'
          body: |
            Repair plugin version collisions and synchronize the marketplace using the shared versioner.
            Generated from current main; normal review and required checks apply before merge.
