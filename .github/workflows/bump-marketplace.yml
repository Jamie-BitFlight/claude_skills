name: Bump Plugin and Marketplace Versions

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
  workflow_dispatch: {}

# Only one run at a time — sequential bumps, not concurrent
concurrency:
  group: bump-marketplace
  cancel-in-progress: false

permissions: {}

jobs:
  bump:
    name: Repair plugin versions and sync marketplace.json
    runs-on: ubuntu-latest
    # Skip commits from this action to avoid infinite loop. workflow_dispatch runs have no
    # head_commit, so short-circuit on event type before evaluating contains() against it.
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-python: true

      - name: Repair drifted plugin versions
        run: |
          uv run -q --no-sync \
            plugins/plugin-creator/scripts/check_plugin_version_bump.py \
            --repair

      - name: Sync marketplace version
        run: |
          uv run -q --no-sync \
            plugins/plugin-creator/scripts/auto_sync_manifests.py \
            --sync-marketplace

      - name: Commit and push if changed
        run: |
          if git diff HEAD --quiet .claude-plugin/marketplace.json 'plugins/*/.claude-plugin/plugin.json'; then
            echo "No plugin or marketplace changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json 'plugins/*/.claude-plugin/plugin.json'
          git commit -m "chore: repair plugin version drift and sync marketplace [skip ci]"

          # A concurrent writer may have advanced main since checkout -- retry
          # on a non-fast-forward rejection by rebasing our repair commit onto
          # the new tip before pushing again, so the authoritative repair
          # never silently drops (issue #3027). Steps run under `bash -e`, so
          # a rebase conflict (a second concurrent writer touching the same
          # generated manifest) must be caught explicitly -- an unguarded
          # `git rebase` failure would otherwise kill the step immediately,
          # skipping the remaining attempts and the final ::error:: below.
          # Only a non-fast-forward rejection is retried -- any other push
          # failure (auth, branch protection, network) fails fast with the
          # real error surfaced instead of masking it behind pointless retries.
          for attempt in 1 2 3; do
            push_output=$(git push 2>&1) && exit 0
            echo "$push_output"
            if ! grep -qE "(non-fast-forward|fetch first|rejected)" <<<"$push_output"; then
              echo "::error::git push failed for a reason other than a non-fast-forward rejection -- see output above"
              exit 1
            fi
            echo "Push rejected (attempt $attempt/3) -- fetching and rebasing"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict (attempt $attempt/3) -- aborting rebase and retrying from a fresh fetch"
              git rebase --abort || true
              continue
            fi
          done

          echo "::error::Failed to push repair commit after 3 attempts"
          exit 1
