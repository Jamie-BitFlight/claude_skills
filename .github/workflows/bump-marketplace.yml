name: Bump Plugin and Marketplace Versions

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
  workflow_dispatch: {}

# Only one run at a time — sequential bumps, not concurrent
concurrency:
  group: bump-marketplace
  cancel-in-progress: false

permissions: {}

jobs:
  bump:
    name: Repair plugin versions and sync marketplace.json
    runs-on: ubuntu-latest
    # Skip commits from this action to avoid infinite loop. workflow_dispatch runs have no
    # head_commit, so short-circuit on event type before evaluating contains() against it.
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-python: true

      - name: Repair, sync, and push plugin version drift
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Repair + sync run fresh on every attempt, not just once before the
          # push retry loop. The previous design computed the repair/sync
          # commit ONCE, then retried only the push+rebase of that single,
          # now-stale commit. If a concurrent writer advanced main and edited
          # the same generated manifest, the rebase conflicted; `git rebase
          # --abort` restored the same stale commit onto the same stale base;
          # the very next attempt recomputed an identical rebase against the
          # identical new tip and hit the identical conflict -- all 3
          # attempts failed identically and the authoritative repair never
          # reached main (issue #3027 follow-up). check_plugin_version_bump.py
          # --repair and auto_sync_manifests.py --sync-marketplace are
          # idempotent and deterministic given repo state (confirmed for
          # --repair in this PR's T1 evidence), so on a rejected push this
          # loop discards the stale commit outright (git reset --hard onto
          # the newly-fetched tip) and regenerates it from current state --
          # a fresh computation with nothing to reconcile, correct by
          # construction, instead of a text-merge of two conflicting diffs.
          for attempt in 1 2 3; do
            uv run -q --no-sync \
              plugins/plugin-creator/scripts/check_plugin_version_bump.py \
              --repair

            uv run -q --no-sync \
              plugins/plugin-creator/scripts/auto_sync_manifests.py \
              --sync-marketplace

            if git diff --quiet .claude-plugin/marketplace.json 'plugins/*/.claude-plugin/plugin.json'; then
              echo "No plugin or marketplace changes to commit"
              exit 0
            fi

            git add .claude-plugin/marketplace.json 'plugins/*/.claude-plugin/plugin.json'
            git commit -m "chore: repair plugin version drift and sync marketplace [skip ci]"

            push_output=$(git push 2>&1) && exit 0
            echo "$push_output"
            # Only a non-fast-forward rejection is retried -- any other push
            # failure (auth, branch protection, network) fails fast with the
            # real error surfaced instead of masking it behind pointless
            # retries.
            if ! grep -qE "(non-fast-forward|fetch first|rejected)" <<<"$push_output"; then
              echo "::error::git push failed for a reason other than a non-fast-forward rejection -- see output above"
              exit 1
            fi

            echo "Push rejected (attempt $attempt/3) -- discarding the stale commit and regenerating from the new tip"
            git fetch origin main
            git reset --hard origin/main
          done

          echo "::error::Failed to push repair commit after 3 attempts"
          exit 1
