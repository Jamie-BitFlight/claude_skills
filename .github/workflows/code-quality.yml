name: Code quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Prevent duplicate runs when pushing to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Minimal permissions by default
permissions: {}

jobs:
  # =============================================================================
  # Python: Ruff linting and formatting (via prek — single config source)
  # =============================================================================
  lint-python:
    name: Python / Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Lint with Ruff
        run: uv run -q --locked prek run ruff --all-files --show-diff-on-failure

      - name: Check formatting with Ruff
        run: uv run -q --locked prek run ruff-format --all-files --show-diff-on-failure

      # The hook's own `files:` pattern limits it to pyproject.toml changes, and the
      # file-hygiene job runs changed-files-only on pull_request. A change that removes
      # the last import of a dependency without touching pyproject.toml would otherwise
      # skip the audit entirely. Run it here against the whole tree on every event.
      - name: Audit declared dependencies
        run: uv run -q --locked prek run audit-dependencies --all-files --show-diff-on-failure

  # =============================================================================
  # Python: Type checking with ty (Astral)
  # Blocking as of 2026-02-19 — CI run 22188303914 passed cleanly.
  # =============================================================================
  typecheck-ty:
    name: Python / ty
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Run ty
        run: uv run -q --locked ty check .

  # =============================================================================
  # JavaScript/TypeScript/JSON: Biome linting and formatting (via prek)
  # =============================================================================
  lint-js:
    name: JS/TS/JSON / Biome lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Run Biome
        run: uv run -q --locked prek run biome-check --all-files --show-diff-on-failure

  # =============================================================================
  # Markdown: markdownlint (via prek)
  # =============================================================================
  lint-markdown:
    name: Markdown / markdownlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Run markdownlint-cli2
        run: uv run -q --locked prek run markdownlint-cli2 --all-files --show-diff-on-failure

  # =============================================================================
  # Shell: shellcheck and shfmt (via prek)
  # =============================================================================
  lint-shell:
    name: Shell / shellcheck + shfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Run shellcheck
        run: uv run -q --locked prek run shellcheck --all-files --show-diff-on-failure

      - name: Run shfmt
        run: uv run -q --locked prek run shell-fmt-go --all-files --show-diff-on-failure

  # =============================================================================
  # Local hooks: plugin validation (via prek)
  # Blocking since 2026-02-18 — all pre-existing errors resolved.
  # =============================================================================
  validate-plugins:
    name: Local / Plugin validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Validate plugins
        run: uvx skilllint@latest check plugins/ .claude/

  # =============================================================================
  # Local hooks: manifest sync (via prek)
  # Blocking — drift was resolved 2026-02-18.
  #
  # The prek step below only reflects *staged* changes (git diff --cached),
  # which is always empty on a plain CI checkout — it cannot see the PR diff
  # at all, so it always reports "no updates needed" regardless of what
  # actually changed. That gap (issue #3021) is what let PR #3005 merge a
  # plugin content change with zero plugin.json version bump. The second step
  # below closes it with a real base-vs-head comparison. --head-ref is passed
  # explicitly as the PR's own branch tip: on a pull_request trigger,
  # actions/checkout's default HEAD is a synthetic base+PR merge commit, so
  # diffing against bare "HEAD" would mix in base-only changes.
  # =============================================================================
  manifest-sync:
    name: Local / Manifest sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-python

      - name: Check manifest sync
        run: uv run -q --locked prek run agent-marketplace-versioner --all-files --show-diff-on-failure

      - name: Exercise pinned remote versioner integration
        run: uv run --locked pytest -m integration tests/test_marketplace_versioner_integration.py --no-cov

      - name: Require plugin.json version bump for every changed plugin
        if: github.event_name == 'pull_request'
        uses: Jamie-BitFlight/agent-marketplace-versioner@562755fd8f14ee76280130eb6db4612af72fdf45 # v0.1.2
        with:
          command: check

  # =============================================================================
  # File hygiene: trailing whitespace, line endings, etc.
  # Runs via prek (same hooks as pre-commit) — single source of truth.
  # Hooks run: trailing-whitespace, check-merge-conflict,
  #   mixed-line-ending, check-added-large-files, check-case-conflict,
  #   check-executables-have-shebangs, check-shebang-scripts-are-executable,
  #   check-yaml, check-json, check-toml, check-symlinks, destroyed-symlinks
  # validate-research-entries remains enabled here so modified entries are
  # blocking, while the whole-corpus report below remains advisory.
  # =============================================================================
  file-hygiene:
    name: Files / Hygiene checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-python

      - name: Run file hygiene hooks
        env:
          SKIP: sync-pre-commit-deps,conventional-pre-commit,repair-symlinks,biome-check,ruff,ruff-format,pypfmt,markdownlint-cli2,actionlint,shell-fmt-go,shellcheck,agent-marketplace-versioner,skilllint,ty,enable-rerere,validate-research-entries,audit-dependencies
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${GITHUB_HEAD_REF}" "origin/${GITHUB_BASE_REF}")
            uv run --locked prek run --from-ref "${BASE}" --to-ref "origin/${GITHUB_HEAD_REF}" --show-diff-on-failure
          else
            uv run --locked prek run --all-files --show-diff-on-failure
          fi

  # =============================================================================
  # Research: validate research entry structure and completeness.
  # Advisory: as of 2026-08-10, 69/339 entries pre-date the research-curator
  # template and are missing required body sections (Overview, Problem
  # Addressed, etc.) — a genuine content gap tracked for remediation, not a
  # regression from any single change. This whole-corpus report is not wired
  # into quality-gate until the corpus backlog is cleared.
  # =============================================================================
  research-validation:
    name: Research / Entry validation
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Scan research backlinks
        run: uv run -q --locked pytest -m research_vault -v tests/research_backlinks/test_graph_asymmetry.py --no-cov

      - name: Validate research entries
        if: ${{ always() }}
        run: uv run -q --locked prek run validate-research-entries --all-files --show-diff-on-failure

  # =============================================================================
  # Python: pytest test suite
  # =============================================================================
  test-python:
    name: Python / Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Run pytest
        run: uv run -q --locked pytest

  # =============================================================================
  # Python: Cross-backend protocol compliance tests
  # Matrix runs InMemoryBackend and SQLiteBackend via pytest parametrization.
  # GitHubBackend tests are skipped (require BACKLOG_CROSS_BACKEND_GITHUB=1
  # and a live GITHUB_TOKEN — neither is set in this CI job).
  # =============================================================================
  test-cross-backend:
    name: Python / Cross-backend tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [memory, sqlite]
    env:
      BACKLOG_BACKEND: ${{ matrix.backend }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Run cross-backend tests
        run: uv run -q --locked pytest plugins/development-harness/tests/test_cross_backend.py -v -m cross_backend

  # =============================================================================
  # Python: Integration tests (real-subprocess CLI/network-guard behavior)
  # Deselected from the default `test-python` addopts filter because each test
  # spawns a real `uv run` or `pytest` subprocess (~2-30s each vs sub-second
  # in-process tests) — see -m "not e2e and not cross_backend and not
  # integration and not research_vault" in pyproject.toml. No live external credentials required
  # (network-guard probes are self-contained; CLI subprocess tests sanitize
  # BACKLOG_BACKEND/GITHUB_TOKEN), so unlike test-e2e this runs as a required
  # quality-gate job rather than advisory.
  # =============================================================================
  test-integration:
    name: Python / Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      - name: Run integration tests
        run: uv run -q --locked pytest -m "integration and not research_vault" -v plugins/development-harness/tests/ tests/research_backlinks/

      - name: Verify rebase publication identity
        run: uv run -q --locked pytest -m integration -v tests/test_rebase_publication_identity.py

  # =============================================================================
  # Python: End-to-end live validation tests
  # Runs only on main push and manual dispatch — not on PRs.
  # Creates real GitHub issues in a test sandbox repo and cleans up after.
  # Advisory: NOT wired into quality-gate until stable run history established.
  # =============================================================================
  test-e2e:
    name: Python / E2E live tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    # Serialize consumers of this disposable sandbox; do not cancel its cleanup.
    concurrency:
      group: dh-live-e2e-${{ vars.DH_E2E_REPOSITORY }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DH_E2E_REPOSITORY: ${{ vars.DH_E2E_REPOSITORY }}
      GITHUB_REPO: ${{ vars.DH_E2E_REPOSITORY }}
      DH_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DH_ALLOW_TEST_NETWORK: "1"
    steps:
      - name: Prepare live validation evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dh-e2e"
          echo "DH_E2E_REPORT_DIR=$RUNNER_TEMP/dh-e2e" >> "$GITHUB_ENV"
          printf '%s\n' 'Live E2E preflight has not completed.' > "$RUNNER_TEMP/dh-e2e/preflight.log"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python

      # Setup and credentials: plugins/development-harness/docs/live-e2e-validation.md
      # Never fall back to this repository or its automatic GITHUB_TOKEN.
      - name: Validate live sandbox
        id: sandbox
        timeout-minutes: 2
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.DH_E2E_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p "$DH_E2E_REPORT_DIR"
          uv run --locked python scripts/run_bounded.py --timeout-seconds 60 -- \
            uv run --locked python plugins/development-harness/scripts/close_test_issues.py --check-only \
            2>&1 | tee "$DH_E2E_REPORT_DIR/preflight.log"

      - name: Run e2e tests
        timeout-minutes: 10
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.DH_E2E_TOKEN }}
        run: |
          set -o pipefail
          uv run --locked python scripts/run_bounded.py --timeout-seconds 480 -- \
            uv run --locked pytest -m e2e -n 0 -x -v --tb=long --capture=tee-sys \
              -o faulthandler_timeout=60 --junitxml="$DH_E2E_REPORT_DIR/junit.xml" \
              plugins/development-harness/tests/test_live_validation.py \
            2>&1 | tee "$DH_E2E_REPORT_DIR/pytest.log"

      - name: Emergency cleanup (always runs after successful preflight)
        if: always() && steps.sandbox.outcome == 'success'
        timeout-minutes: 2
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.DH_E2E_TOKEN }}
        run: |
          set -o pipefail
          uv run --locked python scripts/run_bounded.py --timeout-seconds 90 -- \
            uv run --locked python plugins/development-harness/scripts/close_test_issues.py \
            2>&1 | tee "$DH_E2E_REPORT_DIR/cleanup.log"

      - name: Preserve live validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dh-e2e/*.log
            ${{ runner.temp }}/dh-e2e/*.jsonl
            ${{ runner.temp }}/dh-e2e/junit.xml
          if-no-files-found: error

  # =============================================================================
  # Summary job that requires all checks to pass
  # =============================================================================
  # The repository ruleset currently requires the historical
  # "JS/TS/JSON / Biome" context. Keep that stable context as the aggregate
  # merge gate so every blocking job below is actually merge-enforced.
  # The underlying Biome job is named "JS/TS/JSON / Biome lint".
  quality-gate:
    name: JS/TS/JSON / Biome
    if: always()
    needs:
      - lint-python
      - typecheck-ty
      - lint-js
      - lint-markdown
      - lint-shell
      - validate-plugins
      - manifest-sync
      - file-hygiene
      - test-python
      - test-cross-backend
      - test-integration
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
