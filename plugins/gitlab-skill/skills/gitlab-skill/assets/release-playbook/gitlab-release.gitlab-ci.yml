# DERIVED + CI-LINT-VERIFIED GitLab Release-only adapter for a Generic package link.
include:
  - local: '/.gitlab/release/base.gitlab-ci.yml'

variables:
  RELEASE_DESCRIPTION_PATH: '__RELEASE_DESCRIPTION_PATH__'
  GENERIC_PACKAGE_NAME: '__GENERIC_PACKAGE_NAME__'
  GENERIC_ASSET_NAME: '__GENERIC_ASSET_NAME__'

create_gitlab_release:
  extends: .release_create
  image: 'registry.gitlab.com/gitlab-org/cli:__GLAB_VERSION__@sha256:__GLAB_IMAGE_DIGEST__'
  script:
    - test -s "$RELEASE_DESCRIPTION_PATH"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: '$RELEASE_DESCRIPTION_PATH'
    assets:
      links:
        - name: '$GENERIC_ASSET_NAME'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${GENERIC_PACKAGE_NAME}/${CI_COMMIT_TAG}/${GENERIC_ASSET_NAME}'
          link_type: 'package'
