# DERIVED + CI-LINT-VERIFIED build adapter.
include:
  - local: '/.gitlab/release/base.gitlab-ci.yml'

build_release:
  extends: .release_build
  image: '__BUILD_IMAGE__@sha256:__BUILD_IMAGE_DIGEST__'
  script:
    - '__BUILD_COMMAND__'
    - test -f "$RELEASE_ASSET_PATH"
  artifacts:
    paths:
      - $RELEASE_ASSET_PATH
