# DERIVED + CI-LINT-VERIFIED release-notes adapter.
include:
  - local: '/.gitlab/release/base.gitlab-ci.yml'

variables:
  NOTES_REQUIRED_EXECUTABLES: '__NOTES_REQUIRED_EXECUTABLES__'

generate_release_notes:
  extends: .release_notes
  image: 'alpine:__NOTES_ALPINE_VERSION__@sha256:__NOTES_IMAGE_DIGEST__'
  before_script:
    - apk add --no-cache git
    - command -v git >/dev/null
    - for executable in $NOTES_REQUIRED_EXECUTABLES; do command -v "$executable" >/dev/null; done
  script:
    - '__RELEASE_NOTES_COMMAND__'
    - test -s "$RELEASE_DESCRIPTION_PATH"
  artifacts:
    paths:
      - $RELEASE_DESCRIPTION_PATH
