name: python3
language: python
version: "1.0"

project_detection:
  markers: [pyproject.toml, setup.py, setup.cfg]
  source_patterns: ["src/**/*.py", "**/*.py"]
  test_patterns: ["tests/**/*.py", "test_*.py", "*_test.py"]

stage_skills:
  design: [python-engineering:python-cli-design-spec]
  implementation: [python-engineering:python-cli-architect, python-engineering:python-pytest-architect]
  testing-forensic-review: [dh:code-reviewer]

# Quality gate commands. {files} is a template variable substituted at
# dispatch time via str.format(files=...) with the list of affected files.
quality_gates:
  format: "uv run ruff format {files}"
  lint: "uv run ruff check {files}"
  typecheck: "uv run ty check {files}"
  test: "uv run pytest tests/ --tb=short"
  standards: "/python-engineering:modernpython"
