  ### How This Currently Works: DH Workflow Extractor System

  The DH plugin's existing workflow documentation lacks machine-readable, step-granular extraction. Current state: `docs/dh-workflow-graph.json` exists with 224 nodes and 7 types, but it captures decision forks (Mermaid diamonds) rather than execution steps — insufficient granularity for impact-radius analysis and agent test generation. The graph has no incremental update mechanism, no quality verification, and no automatic staleness detection.

  When a user or agent needs to understand "if I modify skill X, what actors, steps, MCP calls, and artifacts does that affect?", they must manually trace through reference files, Mermaid diagrams, and prose instructions. No machine-readable index exists to answer this query. The graph does not stay synchronized with repo changes; it is maintained manually and drifts.

  The workflow extraction system will solve this by implementing a deterministic, verified, incrementally-updateable step-granular actor-step graph with automated staleness detection and an agent-facing query skill.

  **How the new system works:**

  1. **Scope Enumeration (enumerate_scope.py)**: Deterministic BFS crawl from entry-point skills (`work-backlog-item`, `*-milestone` family). Follows four reference types: Mermaid node labels containing `.md` paths, slash-command skill invocations (`/dh:skill-name`), agent dispatch declarations (`subagent_type="dh:agent-name"`), and prose file references. Max depth 15 prevents infinite loops. Produces `docs/workflow-layers/SCOPE.md` — flat list of reachable files with entry point, reference type, and depth metadata. Deterministic output enables reproducible file sets. No LLM involved.

  2. **Per-File Extraction Pipeline (dh-extract-file.js)**: Saved dynamic workflow orchestrating five steps for each source file:
     - Step 1 (deterministic): `plan_ensemble.py` reads `extraction-rules.json` (9 step-centric rule groups), assigns uniform worker coverage (window=4 → 9 workers with 4× overlap)
     - Step 2 (LLM): Spawn N haiku workers in parallel. Each reads the same source file, applies one rule-group slice (e.g., group 3 finds artifact reads, group 5 finds agent dispatch). Workers emit fixed-schema findings: `{group, rule, location, verdict, severity, evidence}`
     - Step 3 (deterministic): `reduce.py` merges worker output, denoises via corroboration (weight≥2 threshold default), applies two new enhancements: slug-normalised heading keys (minor text variations no longer break deduplication) and cross_group signal (findings from ≥2 different rule groups elevated in ranking)
     - Step 4 (LLM): One sonnet verifier reads reduce.py output, confirms each finding by searching source file at cited heading for evidence quote (≥80% match acceptable), votes CONFIRMED/PLAUSIBLE/REFUTED. Logs weight=1 CONFIRMED findings to `.tmp/extraction-misses/{date}-{slug}.md` to drive extraction rule refinement
     - Step 5 (deterministic): `merge_layer.py` idempotent fragment→layer ETL: reads existing layer JSON, removes all nodes where `source_file` matches fragment, appends new verified nodes, writes atomically via `.tmp` + `os.replace()`. Idempotent: running twice with same fragment produces same result

  3. **Fragment Storage and ETL**: Each extraction run produces a fragment JSON file (not direct layer write), containing verified and unverified items scoped to one source file. `merge_layer.py` merges fragments incrementally. A change to one skill file triggers re-extraction of only that file's contribution to each affected layer, not the entire graph.

  4. **Staleness Detection (session-start-workflow-staleness.cjs hook)**: Post-SessionStart, hook reads `meta.json` fingerprints (last-analyzed commit hash and per-file SHA-256). Compares against HEAD. Detects changed files. Dispatches `dh-extract-file` workflow for each changed file (if changed), updating the graph. Session sees fresh graph from the start.

  5. **Graph Query Skill (/dh:workflow-query)**: Agent-facing skill providing four query patterns: (1) step/node by actor or source file, (2) affected nodes when source file changes, (3) artifact dependencies (reads/writes), (4) dispatch topology and team composition. Includes freshness check: compares graph staleness-tracking timestamp against HEAD; if graph is stale, returns a `stale: true` flag with guidance to run extraction. Enables AI agents to query the graph with confidence about currency.

  **Data model and node types:**

  Nodes: `step` (discrete action by an actor, carries optional guard condition), `decision` (conditional fork with named branches, extracted from Mermaid diamonds), `agent` (actor from `agents/*.md`), `skill` (loaded by step or agent), `reference_file` (workflow reference loaded via expansion), `mcp_tool` (single MCP capability), `artifact` (document/data produced/consumed), `backend` (storage layer: GitHub, beads, sqlite, memory), `hook` (lifecycle event handler).

  Edges: `branch` (decision → next), `next` (step → next step, sequential), `defers_to` (step/skill → reference file), `dispatches` (step → agent), `calls` (step → mcp_tool), `reads`/`writes` (step ↔ artifact), `loads` (agent → skill/reference_file), `stores_in` (mcp_tool → backend), `triggered_by` (hook → event), `gap` (transition exists but unattested, rendered as dashed amber — required for correct impact analysis).

  **Extraction rules (9 step-centric groups):**

  Group 1: Numbered/bulleted steps with actor and action text. Group 2: Conditional guards ("If --quick", "When BACKLOG_BACKEND=", "Skip when:", "Only if:"). Group 3: Artifact reads (`artifact_read()`, `backlog_view(..., section=...)`, `sam_plan(action='status')`). Group 4: Artifact writes (`artifact_register(content=...)`, `backlog_groom(section=..., content=...)`, `sam_plan(action='create')`). Group 5: Agent dispatch (`subagent_type="dh:..."`, `TeamCreate(team_name=...)`, named wave members). Group 6: File-reference expansion (Mermaid nodes with `.md` paths, prose references to `references/...`). Group 7: Skill invocations (`/dh:skill-name`, `Skill(skill='dh:...')`). Group 8: MCP tool calls full and short form (`mcp__plugin_dh_backlog__*`, `backlog_groom()`, `sam_task()`, `artifact_list()`). Group 9: Actor topology (orchestrator inline, subagent via Agent tool, team-member via TeamCreate, hook via lifecycle event).

  **Cross-plugin architecture:**

  `plan_ensemble.py` and `reduce.py` live in `plugins/plugin-creator/skills/ensemble-rule-review/scripts/`. DH imports and uses these for extraction automation. DH's `dh-extract-file.js` workflow orchestrates calls to both scripts. `reduce.py` requires two upstream code changes (Section 8 of architect spec): (1) slug-normalised heading keys — apply `re.sub(r'[^a-z0-9]+', '_', heading.lower())` to headings before keying when no line number present, (2) `cross_group: bool` flag on merged findings — set True when workers from ≥2 different rule groups corroborate the same location. Both changes are backward-compatible (old callers get default behavior). Changes gated behind a feature flag or version check to preserve existing ensemble consumers.

  **Agents and skills:**

  New agents start from scratch: `workflow-extractor-worker.md` (haiku fleet, reads one source file, applies one rule-group slice, emits findings) and `workflow-extractor-reducer.md` (sonnet verifier, confirms findings against source, logs misses). New skill: `/dh:workflow-query` (agent-facing step-graph query with 4 patterns and freshness check). Domain-wide skills for all tasks: `python-engineering:python3-typing`, `python-engineering:python3-testing`, `plugin-creator:claude-plugins-reference-2026` (for plugin.json and schema updates).

  **Hook integration:**

  `session-start-workflow-staleness.cjs` hook executes post-SessionStart. Checks `meta.json` staleness tracking, detects changed files, dispatches extraction. Registered in `hooks/hooks.json` alongside existing `session-start-session-id` entry (no conflicts). Hook preserves prior entries and adds new staleness-detection entry.

  **Verification and quality:**

  Every extracted node carries `verified: bool` flag. Haiku workers produce candidates; sonnet verifier confirms via evidence-quote grounding (≥80% match acceptable). Unconfirmed findings go to `unverified_items` array. Weight=1 CONFIRMED misses logged for rule refinement. Graph quality is observable and improvable via the miss log and unverified items array.

  **Scope and entry points:**

  Entry points: `work-backlog-item` skill + its full reference tree (40+ files in `references/workflows/`), and six `*-milestone` skills (`groom-milestone`, `work-milestone`, `complete-milestone`, `create-milestone`, `start-milestone`, `group-items-to-milestone`). Reachability: file is in scope if reachable from entry point via one of four reference types, max depth 15. Stub skills (`groom-backlog-item`, `create-backlog-item`) are NOT entry points — they delegate to `work-backlog-item`. Scope is deterministic and reproducible.

  **Vocabulary oracle:**

  `docs/workflow-layers/KNOWN_ENTITIES.md` is the canonical reference for all agent names, skill names, MCP tool names (canonical and short-form aliases), artifact type keys, and backlog section names. Extraction workers validate every extracted entity against this list. New entities discovered during extraction are added to the file following the Living Document Protocol before findings are emitted — keeps the file current as the plugin grows. KNOWN_ENTITIES.md is maintained and read by extraction workers, not by agents.

