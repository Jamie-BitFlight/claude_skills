    paths absolute and the cross-plugin script dir resolved by a verified strategy.\n\
    \n## Inputs\n- Architect spec §1.1 (pipeline + return value + invocation path),
    §4.3 (module boundary + fragment lifecycle), §8.1 (plan_ensemble caller contract:
    --window 4, absolute --report-dir)\n- enumerate_scope.py (T01), merge_layer.py
    (T02), reduce.py changes (T07), extraction-rules.json (T05), worker (T09), reducer
    (T10)\n- T11 verdict (plan_ensemble compatibility confirmed)\n- `-p` mode constraint
    (feature-context Open Implementation Decision 5): all agent dispatch via agentType
    parameter, NOT Skill() calls\n\n## Requirements\n1. FIRST: empirically resolve
    ENSEMBLE_SCRIPTS_DIR. Prefer reading `DH_ENSEMBLE_SCRIPTS_DIR` env var; fall back
    to a path constructed from `__dirname`/`CLAUDE_PLUGIN_ROOT`. Verify the resolved
    path actually contains plan_ensemble.py and reduce.py before proceeding (log and
    fail loudly if not).\n2. Accept input args `{ source_file, layer_type, report_dir?
    }` (paths relative to plugin root; resolve to absolute internally).\n3. Step 1
    (deterministic): call plan_ensemble.py with extraction-rules.json, `--report-dir
    <absolute>`, `--window 4`, `--json` → worker_assignments.\n4. Step 2 (LLM): spawn
    N haiku workers (workflow-extractor-worker) in parallel via agentType dispatch,
    one per assignment → N output files in report_dir.\n5. Step 3 (deterministic):
    call reduce.py (or dh_reduce.py if T07 used the wrapper) → ranked report.\n6.
    Step 4 (LLM): dispatch one sonnet verifier (workflow-extractor-reducer) → fragment
    JSON + miss log.\n7. Step 5 (deterministic): call merge_layer.py with the fragment
    → updated layer JSON; delete the fragment file after success.\n8. Return `{ layer_path,
    verified_count, unverified_count, miss_log_path }` (§1.1).\n9. All subprocess
    paths absolute (§4.3 contract). Write fragment to `.tmp/fragments/` before merge;
    remove after.\n10. Do NOT update meta.json or COVERAGE.md (owned by hook, §4.3
    Does NOT own).\n\n## Constraints\n- Do NOT use Skill() calls — `-p`/hook context
    cannot load skills; dispatch agents via agentType only.\n- Do NOT hardcode a cross-plugin
    path without the runtime existence check.\n- Do NOT pass relative paths to subprocesses.\n\
    - Do NOT own scope enumeration, meta.json, or COVERAGE.md updates.\n\n## Expected
    Outputs\n- `plugins/development-harness/workflows/dh-extract-file.js` (new file)\n\
    \n## Acceptance Criteria\n1. The script resolves ENSEMBLE_SCRIPTS_DIR and verifies
    plan_ensemble.py + reduce.py exist there before running (fails loudly otherwise).\n\
    2. plan_ensemble.py is invoked with `--window 4` and an absolute `--report-dir`
