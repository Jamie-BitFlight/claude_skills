- id: T07
  title: 'reduce.py upstream changes (plugin-creator): slug-normalised heading keys
    + cross_group signal, behind backward-compat gate'
  status: in-progress
  agent: python-engineering:python-cli-architect
  priority: 2
  complexity: high
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  parallelize-with:
  - T01
  - T02
  - T04
  - T05
  - T06
  accuracy-risk: high
  reason: Cross-plugin contribution (ADR-4). reduce.py is owned by 
    plugin-creator; DH must NOT call it until these changes land behind a 
    passing backward-compat gate. Required before dh-extract-file.js integration
    (T10).
  body: "## Context\nThe ensemble reducer `plugins/plugin-creator/skills/ensemble-rule-review/scripts/reduce.py`
    needs 2 changes for the step-extraction use case (architect §8.2, ADR-4). DH does
    NOT own this file — changes are contributed upstream to plugin-creator. A backward-compat
    gate (§8.3) decides upstream-edit vs DH-owned wrapper. This file already exists
    (fact-checked: reduce.py exists).\n\n## Objective\nApply Change 1 (slug-normalised
    heading keys in normalize_location) and Change 2 (cross_group flag on Merged)
    to reduce.py, gated by the §8.3 backward-compat protocol; fall back to a DH wrapper
    (scripts/dh_reduce.py) only if backward-compat breaks.\n\n## Inputs\n- Architect
    spec §8.2 (exact code for both changes + backward-compat tests), §8.3 (verification
    protocol + wrapper fallback), ADR-4\n- Current `plugins/plugin-creator/skills/ensemble-rule-review/scripts/reduce.py`\n\
    - Load `/plugin-creator:ensemble-rule-review` to understand the reducer design
    intent before editing.\n\n## Requirements\n1. Change 1 — in `normalize_location()`:
    when no line-number match, normalise the heading portion. Split on first `:`,
    apply `re.sub(r'[^a-z0-9]+', '_', heading.strip().lower()).strip('_')` to the
    heading part, return `f\"{path_part}:{slug}\"`. Preserve existing line-number
    behaviour unchanged (architect §8.2 Change 1 code).\n2. Change 2 — add `groups_seen:
    set[str]` field to `Merged` and a `cross_group` property returning `len(self.groups_seen)
    >= 2`. In `reduce_findings()`, add `finding.group` to `entry.groups_seen` when
    merging. In `format_report()`, include `cross_group=True` in output lines where
    `m.cross_group` (architect §8.2 Change 2 code).\n3. Run the §8.3 backward-compat
    protocol IN ORDER: (a) run existing reduce.py test suite — all pass; (b) run the
    §8.2 backward-compat tests; (c) run the full ensemble on a real extraction-rules.json
    sample and confirm output is semantically equivalent (same findings + cross_group
    annotations).\n4. If backward-compat breaks: do NOT fork reduce.py. Create `plugins/development-harness/scripts/dh_reduce.py`
    (PEP 723) importing reduce.py functions and applying slug-normalisation + cross-group
    as post-processing (architect §8.3 fallback). Attempt upstream edit FIRST.\n\n\
    ## Constraints\n- Do NOT fork/copy reduce.py wholesale.\n- Do NOT change the existing
    line-number normalisation behaviour.\n- Do NOT create dh_reduce.py proactively
    — only if the gate fails (ADR-4 consequence).\n- Do NOT break the existing reduce.py
    public API consumed by other ensemble callers.\n\n## Expected Outputs\n- `plugins/plugin-creator/skills/ensemble-rule-review/scripts/reduce.py`
    (edited) OR `plugins/development-harness/scripts/dh_reduce.py` (fallback wrapper)
    — exactly one path taken\n\n## Acceptance Criteria\n1. `normalize_location('src/foo.md:42')
    == 'src/foo.md:42'` and `normalize_location('/abs/src/foo.md:42') == 'src/foo.md:42'`
    (line-number behaviour unchanged).\n2. `normalize_location('groom/swarm.md:##
    Wave 1 — impact-analyst') == 'groom/swarm.md:wave_1_impact_analyst'` and the em-dash
    and hyphen variants produce the same key (architect §8.2 Change 1 tests).\n3.
    cross_group is False for single-group corroboration and True for ≥2 distinct groups
    at the same location (architect §8.2 Change 2 tests).\n4. The existing reduce.py
    test suite passes unchanged.\n5. The full-ensemble semantic-equivalence check
    (§8.3 step 3) passes.\n6. `uv run ty check` and `uv run prek run --files <edited
    file>` exit 0.\n\n## CoVe Checks\n- Key claims to verify:\n  - Line-number normalisation
    is byte-for-byte unchanged.\n  - cross_group does not change the set of surviving
    findings, only annotates them.\n  - format_report does not crash on the prior
    report format.\n- Verification questions:\n  1. Do all four §8.2 normalize_location
    assertions hold?\n  2. Do both cross_group assertions hold?\n  3. Does the existing
    reduce.py suite pass with zero new failures?\n  4. Is the ensemble ranked output
    semantically equivalent (same findings) before and after?\n- Evidence to collect:
    existing-suite results, §8.2 doctest/assert outputs, the semantic-equivalence
    diff.\n- Revision rule: if backward-compat breaks at any step, switch to the dh_reduce.py
    wrapper path and document why in the handoff.\n\n## Verification Steps\n1. Run
    the existing reduce.py test suite — expect all pass.\n2. Run the §8.2 backward-compat
    tests (added in T08) — expect all pass.\n3. Run the full ensemble on a real extraction-rules.json
    sample; compare findings before/after for semantic equivalence.\n4. `uv run ty
    check <edited file>` and `uv run prek run --files <edited file>` — expect exit
    0.\n5. Run: `git add <edited file>` then `git commit -m \"feat(ensemble-rule-review):
    slug-normalise heading keys and add cross_group signal\"` (scope = ensemble-rule-review
    for upstream edit, or development-harness for the wrapper).\n\n## Handoff\nReturn:
    path taken (upstream edit vs wrapper) and why, all backward-compat results, existing-suite
    result, semantic-equivalence outcome, ty/prek results."
  handoff: |-
    Report which path was taken (upstream edit vs dh_reduce.py wrapper), backward-compat test results, and that the existing reduce.py suite still passes.
  started: '2026-06-20T10:58:42.148120+00:00'
