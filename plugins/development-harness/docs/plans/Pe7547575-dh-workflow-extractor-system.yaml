- id: T14
  title: Create hooks/session-start-workflow-staleness.cjs — staleness detection
    + extraction dispatch
  status: not-started
  agent: dh:task-worker
  dependencies:
  - T12
  - T13
  priority: 4
  complexity: high
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  accuracy-risk: medium
  reason: The hook SCRIPT owns the orchestration logic (staleness detection, 
    git-diff enumeration, dispatch, meta.json + COVERAGE.md updates). Distinct 
    from hooks.json registration (T15). Depends on dh-extract-file.js (T12, it 
    dispatches it) and meta.json schema (T13).
  body: "## Context\nCreate the SessionStart hook SCRIPT that detects workflow-graph
    staleness and dispatches incremental extraction. This is where the orchestration
    logic lives — it is a substantial JS file, distinct from the hooks.json registration
    (T15). Source: architect §4.6 (module boundary + 7-step contract), §7.1 (full
    algorithm, timeout, error handling), ADR-5. Load `/plugin-creator:hook-creator`
    for hook conventions.\n\n## Objective\nProduce session-start-workflow-staleness.cjs
    implementing the §7.1 algorithm: read meta.json, diff against HEAD, intersect
    with SCOPE.md, dispatch dh-extract-file.js (background) per changed in-scope file,
    update meta.json and regenerate COVERAGE.md — non-blocking, never exits non-zero.\n\
    \n## Inputs\n- Architect spec §4.6 (7-step inter-module contract), §7.1 (algorithm
    pseudocode, timeout 30000ms, SCOPE.md dependency, error handling, env access),
    ADR-5\n- dh-extract-file.js (T12) — the workflow it dispatches\n- meta.json +
    step.json (T13), enumerate_scope.py (T01, invoked if SCOPE.md missing)\n\n## Requirements\n\
    1. JavaScript (Node.js CJS) per repo language conventions.\n2. Implement the §4.6/§7.1
    algorithm: (1) read meta.json → last_analyzed_commit (empty=first run); (2) `git
    diff {last_analyzed_commit} HEAD --name-only` (or treat all SCOPE files as changed
    on first run); (3) read SCOPE.md → in-scope set; (4) intersect changed ∩ in-scope;
    (5) for each: dispatch dh-extract-file.js as a background process; (6) on first
    run if SCOPE.md missing, invoke enumerate_scope.py synchronously first; (7) print
    a notification per file being re-extracted.\n3. Read CLAUDE_PLUGIN_ROOT to locate
    meta.json, SCOPE.md, dh-extract-file.js.\n4. Background dispatch: hook prints
    what will extract and exits (does not block the session); extraction runs in background.
    meta.json is updated by dh-extract-file.js per file OR by the hook after dispatch
    — follow §7.1 (the pseudocode notes meta.json updated by dh-extract-file.js; honour
    whichever the §4.6 contract states, and document the choice).\n5. Error handling
    (§7.1): malformed meta.json → treat as first run; git command failure → log warning
    and exit 0; SCOPE.md missing and enumerate_scope.py fails → warn and exit 0. NEVER
    exit non-zero (a failing hook blocks the session).\n6. Preserve the COVERAGE.md
    regeneration step if assigned to the hook (§4.6 step 7) — regenerate from layer
    JSON files.\n\n## Constraints\n- Do NOT block the session: no synchronous wait
    on extraction; never exit non-zero.\n- Do NOT own extraction logic (delegate to
    dh-extract-file.js) or scope crawl logic (delegate to enumerate_scope.py).\n-
    Do NOT use Skill() calls.\n- Do NOT register the hook in hooks.json here — that
    is T15.\n\n## Expected Outputs\n- `plugins/development-harness/hooks/session-start-workflow-staleness.cjs`
    (new file)\n\n## Acceptance Criteria\n1. The script implements all 7 §4.6 contract
    steps.\n2. First-run behaviour (empty last_analyzed_commit) treats all SCOPE files
    as changed; invokes enumerate_scope.py if SCOPE.md is absent.\n3. The intersection
    (changed ∩ in-scope) is computed from `git diff --name-only` and SCOPE.md.\n4.
    Each in-scope changed file triggers a background dispatch of dh-extract-file.js
    with `{ source_file, layer_type: 'step' }`.\n5. Malformed meta.json, git failure,
    and enumerate_scope failure all result in exit 0 (non-blocking).\n6. The script
    never exits non-zero.\n7. `uv run prek run --files plugins/development-harness/hooks/session-start-workflow-staleness.cjs`
    exits 0.\n\n## CoVe Checks\n- Key claims to verify:\n  - The hook is strictly
    non-blocking and never exits non-zero.\n  - First-run and malformed-meta.json
    paths both behave per §7.1.\n  - Dispatch targets dh-extract-file.js with the
    documented args.\n- Verification questions:\n  1. With empty meta.json, does it
    dispatch for all SCOPE files (or run enumerate_scope first if SCOPE.md absent)?\n\
    \  2. On a simulated git failure, does it log and exit 0?\n  3. Is extraction
    dispatched in background (no synchronous wait)?\n- Evidence to collect: a dry-run
    invocation with a stubbed env showing dispatch decisions and exit 0 on each error
    branch.\n- Revision rule: if any error branch can exit non-zero, fix before completing.\n\
    \n## Verification Steps\n1. Dry-run with CLAUDE_PLUGIN_ROOT set and a controlled
    meta.json/SCOPE.md; confirm dispatch decisions and exit 0.\n2. Simulate malformed
    meta.json and git failure; confirm exit 0 each time.\n3. `uv run prek run --files
    plugins/development-harness/hooks/session-start-workflow-staleness.cjs` — expect
    exit 0.\n4. Run: `git add plugins/development-harness/hooks/session-start-workflow-staleness.cjs`
    then `git commit -m \"feat(workflow-extractor): add session-start staleness hook
    script\"`\n\n## Handoff\nReturn: script path, 7-step coverage checklist, error-branch
    exit-code confirmation, where meta.json gets updated (hook vs dh-extract-file.js)
    and why, prek result."
  handoff: |-
    Report script path, the 7-step algorithm coverage, non-blocking error handling, and that it dispatches dh-extract-file.js per changed in-scope file.
