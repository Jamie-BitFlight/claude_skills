- id: T09
  title: Create agents/workflow-extractor-worker.md — haiku fleet worker (9 
    step-centric rule groups)
  status: not-started
  agent: plugin-creator:agent-creator
  dependencies:
  - T05
  - T06
  priority: 3
  complexity: medium
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  parallelize-with:
  - T12
  accuracy-risk: high
  reason: Haiku extraction worker. Reads extraction-rules.json (T05) and 
    KNOWN_ENTITIES.md (T06) so both must exist first. Fidelity of the whole 
    graph depends on this agent's instruction contract.
  body: "## Context\nCreate the haiku fleet worker agent for the DH workflow ensemble.
    It reads ONE source file, applies ONE rule-group slice, and emits fixed-schema
    findings consumed by reduce.py. This file does NOT exist (fact-checked). Source:
    architect §1.1, §4.4, §5.1 (full body spec). Load `/plugin-creator:agent-creator`
    for agent authoring conventions.\n\n## Objective\nProduce workflow-extractor-worker.md
    with the exact frontmatter and the 8-point body instruction contract from §5.1,
    written as an effective haiku-targeted prompt.\n\n## Inputs\n- Architect spec
    §5.1 (frontmatter + 8-point body contract + what-NOT-to-include), §4.4 (module
    boundary), §2.7 (FindingSchema output shape)\n- extraction-rules.json (T05) —
    the 9 groups the worker applies\n- KNOWN_ENTITIES.md (T06) — the vocabulary oracle
    the worker validates against\n\n## Requirements\n1. Frontmatter exactly per §5.1:
    name=workflow-extractor-worker, model=claude-haiku-4-5, tools=Read, Grep, Write,
    and the specified description (states \"Use only when dispatched by dh-extract-file.js;
    do not invoke directly\").\n2. Body must contain, in order, all 8 §5.1 points:
    (1) role declaration (mechanical, one file/one slice, no judgments); (2) input
    parsing (source_file, rule_group_id, rules, outfile, known_entities_path); (3)
    pre-extraction read of known_entities_path as vocabulary oracle + alias resolution
    to canonical names; (4) evidence-source constraint (body content only, NOT frontmatter);
    (5) fixed output schema (group/rule/location/verdict/severity/evidence YAML, evidence
    ≤200 chars); (6) PASS verdict when no instances found; (7) write discipline (Write
    to outfile absolute path, not stdout, not message text); (8) stop condition `STATUS:
    DONE — wrote N findings to {outfile}`.\n3. Location format must be `relative/path.md:##
    Exact Section Heading` (§4.4 contract).\n4. Honour the what-NOT-to-include list
    (§5.1): no skill references, no MCP calls, no agent dispatch, no references to
    report_dir/reduce.py.\n\n## Constraints\n- Do NOT give the worker tools beyond
    Read, Grep, Write (frontmatter tools field exact — wildcards silently strip tools).\n\
    - Do NOT include any instruction that requires the worker to read multiple files
    or follow references (§4.4 Does NOT own).\n- Do NOT add a STATUS-silent path —
    explicit STATUS: DONE required (repo agent-output-contracts rule).\n\n## Expected
    Outputs\n- `plugins/development-harness/agents/workflow-extractor-worker.md` (new
    file)\n\n## Acceptance Criteria\n1. Frontmatter matches §5.1 exactly (name, description,
    model=claude-haiku-4-5, tools: Read, Grep, Write).\n2. All 8 body contract points
    from §5.1 are present and ordered.\n3. The output schema block matches §2.7/§5.1
    (group, rule, location, verdict, severity, evidence; evidence ≤200 chars).\n4.
    The what-NOT-to-include items are absent from the body.\n5. `uvx skilllint@latest
    check plugins/development-harness/agents/workflow-extractor-worker.md` exits 0.\n\
    6. `uv run prek run --files plugins/development-harness/agents/workflow-extractor-worker.md`
    exits 0.\n\n## CoVe Checks\n- Key claims to verify:\n  - The evidence-source constraint
    (body only, not frontmatter) is explicit.\n  - The PASS-verdict instruction is
    present (reducer needs to know the worker ran).\n  - tools field is exactly Read,
    Grep, Write.\n- Verification questions:\n  1. Does the body instruct the worker
    to read known_entities_path BEFORE the source file?\n  2. Is the location format
    `path.md:## Heading` specified verbatim?\n  3. Does the body forbid skill/MCP/dispatch
    usage?\n- Evidence to collect: skilllint output, a side-by-side of the 8 points
    vs §5.1.\n- Revision rule: if any of the 8 points is missing or the tools field
    drifts, revise before completing.\n\n## Verification Steps\n1. `uvx skilllint@latest
    check plugins/development-harness/agents/workflow-extractor-worker.md` — expect
    exit 0.\n2. `uv run prek run --files plugins/development-harness/agents/workflow-extractor-worker.md`
    — expect exit 0.\n3. Confirm by inspection all 8 §5.1 body points present and
    the what-NOT list absent.\n4. Run: `git add plugins/development-harness/agents/workflow-extractor-worker.md`
    then `git commit -m \"feat(workflow-extractor): add workflow-extractor-worker
    haiku agent\"`\n\n## Handoff\nReturn: file path, frontmatter summary, checklist
    of the 8 §5.1 points, skilllint/prek results."
  handoff: |-
    Report agent file path, frontmatter (model=claude-haiku-4-5, tools=Read,Grep,Write), and that all 8 body-spec contract points from §5.1 are present.
- id: T10
  title: Create agents/workflow-extractor-reducer.md — sonnet verifier (active 
    evidence check + miss log)
  status: not-started
  agent: plugin-creator:agent-creator
  priority: 3
  complexity: medium
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  parallelize-with:
  - T09
  accuracy-risk: high
  reason: Sonnet verifier agent. Reads reduce.py ranked output, verifies 
    evidence citations, votes CONFIRMED/PLAUSIBLE/REFUTED, writes the fragment 
    JSON and miss log. The active evidence check is what prevents hallucinated 
    citations entering the layer.
  body: "## Context\nCreate the sonnet verifier agent. It does not extract — it verifies
    findings that survived corroboration (reduce.py output), votes CONFIRMED/PLAUSIBLE/REFUTED
    against the source citation, writes the fragment JSON and the miss log. This file
    does NOT exist (fact-checked). Source: architect §1.1, §4.5, §5.2 (full body spec),
    §2.4 (fragment shape), §3.5 (miss log). Load `/plugin-creator:agent-creator`.\n\
    \n## Objective\nProduce workflow-extractor-reducer.md with the exact frontmatter
    and the 8-point body contract from §5.2, including the active evidence check and
    miss-log protocol.\n\n## Inputs\n- Architect spec §5.2 (frontmatter + 8-point
    body contract), §4.5 (module boundary + vote semantics), §2.4 (ExtractionFragment),
    §3.4 (fragment file), §3.5 (miss log format)\n\n## Requirements\n1. Frontmatter
    exactly per §5.2: name=workflow-extractor-reducer, model=claude-sonnet-4-5, tools=Read,
    Write, and the specified description (\"Use only when dispatched by dh-extract-file.js\"\
    ).\n2. Body must contain, in order, all 8 §5.2 points: (1) role declaration (verify,
    not extract); (2) input parsing (source_file, reduce_output_path, fragment_output_path,
    miss_log_path, layer_type); (3) per-finding verification protocol (parse location,
    read source at heading, search evidence ≥80% overlap, vote CONFIRMED/PLAUSIBLE/REFUTED
    with the exact definitions); (4) fragment JSON output shape per §2.4/§5.2 (meta
    with verified_count/unverified_count, items, unverified_items); (5) miss-log protocol
    (weight-1 CONFIRMED findings → miss log with group/location/evidence/rule_slug
    + one-sentence pattern note); (6) active evidence check (CONFIRM source_file matches,
    heading exists, evidence appears — else move to unverified_items); (7) write discipline
    (fragment to fragment_output_path; miss log only if weight-1 CONFIRMED exist);
    (8) stop condition `STATUS: DONE — verified_count={N} plausible={P} refuted={R}
    misses={M}`.\n3. REFUTED findings go to unverified_items; weight-1 CONFIRMED go
    to miss log (§4.5).\n\n## Constraints\n- Do NOT give tools beyond Read, Write
    (exact frontmatter tools field).\n- Do NOT instruct the reducer to extract new
    findings or perform corroboration (owned by reduce.py, §4.5 Does NOT own).\n-
    Do NOT add a silent-completion path — explicit STATUS required.\n\n## Expected
    Outputs\n- `plugins/development-harness/agents/workflow-extractor-reducer.md`
    (new file)\n\n## Acceptance Criteria\n1. Frontmatter matches §5.2 exactly (name,
    description, model=claude-sonnet-4-5, tools: Read, Write).\n2. All 8 body contract
    points from §5.2 are present and ordered.\n3. The active evidence check (point
    6) explicitly lists the three CONFIRM conditions and the move-to-unverified_items
    fallback.\n4. The miss-log protocol (point 5) targets weight-1 CONFIRMED findings
    only and includes a pattern-analysis note.\n5. Vote definitions (CONFIRMED ≥80%
    match, PLAUSIBLE section exists no exact quote, REFUTED section missing/fabricated)
    match §5.2 / §4.5.\n6. `uvx skilllint@latest check plugins/development-harness/agents/workflow-extractor-reducer.md`
    exits 0.\n7. `uv run prek run --files plugins/development-harness/agents/workflow-extractor-reducer.md`
    exits 0.\n\n## CoVe Checks\n- Key claims to verify:\n  - The active evidence check
    prevents hallucinated citations (the design purpose).\n  - REFUTED routing and
    weight-1 miss-log routing are both explicit.\n- Verification questions:\n  1.
    Does the body require confirming the cited heading exists before writing to items[]?\n\
    \  2. Are CONFIRMED/PLAUSIBLE/REFUTED defined with the ≥80% threshold?\n  3. Is
    the fragment JSON shape exactly §2.4/§5.2 (verified_count/unverified_count, items,
    unverified_items)?\n- Evidence to collect: skilllint output, side-by-side of 8
    points vs §5.2.\n- Revision rule: if the active evidence check or any vote definition
    is missing/loose, revise before completing.\n\n## Verification Steps\n1. `uvx
    skilllint@latest check plugins/development-harness/agents/workflow-extractor-reducer.md`
    — expect exit 0.\n2. `uv run prek run --files plugins/development-harness/agents/workflow-extractor-reducer.md`
    — expect exit 0.\n3. Inspect all 8 §5.2 points present, vote definitions and active
    evidence check explicit.\n4. Run: `git add plugins/development-harness/agents/workflow-extractor-reducer.md`
    then `git commit -m \"feat(workflow-extractor): add workflow-extractor-reducer
    sonnet agent\"`\n\n## Handoff\nReturn: file path, frontmatter summary, checklist
    of the 8 §5.2 points, skilllint/prek results."
  handoff: |-
    Report agent file path, frontmatter (model=claude-sonnet-4-5, tools=Read,Write), and that the active-evidence-check (§5.2 point 6) and miss-log protocol (point 5) are present.
- id: T11
  title: Verify plan_ensemble.py backward-compat with 9-group 
    extraction-rules.json (no code change)
  status: not-started
  agent: python-engineering:python-cli-architect
  dependencies:
  - T05
  priority: 3
  complexity: low
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  parallelize-with:
  - T09
  - T10
  accuracy-risk: high
  reason: VERIFY_COMPATIBLE gate (§8.1). plan_ensemble.py needs no code change 
    but the 9-group rules + window=4 contract must be empirically verified 
    before any DH integration test uses it. Gate for T12 integration.
  body: "## Context\nplan_ensemble.py (plugin-creator) requires no code change but
    its compatibility with the new 9-group extraction-rules.json (T05) and the DH
    caller contract (--window 4, absolute --report-dir) must be empirically verified
    before any DH integration uses it. Source: architect §1.2 (VERIFY_COMPATIBLE),
    §8.1 (exact verification gate command). This file exists (fact-checked).\n\n##
    Objective\nRun the §8.1 verification gate and confirm: 9 workers (one per group),
    window=4, uniform redundancy=4, each outfile an absolute path. Produce a PASS/FAIL
    verdict (no code edit).\n\n## Inputs\n- Architect spec §8.1 (the literal verification
    command + assertions), §4.8 (extraction-rules.json contract)\n- extraction-rules.json
    from T05 (must exist with 9 groups)\n- `plugins/plugin-creator/skills/ensemble-rule-review/scripts/plan_ensemble.py`\n\
    \n## Requirements\n1. Run the §8.1 gate command from repo root:\n   `uv run --script
    plugins/plugin-creator/skills/ensemble-rule-review/scripts/plan_ensemble.py plugins/development-harness/docs/workflow-layers/extraction-rules.json
    --report-dir /tmp/test-ensemble-verify --window 4 --json`\n   piped to the §8.1
    python assertion (window==4, len(workers)==9, redundancy=={4}).\n2. Confirm each
    worker `outfile` is an absolute path.\n3. If the gate fails, report the exact
    failure — do NOT modify plan_ensemble.py (it is VERIFY_COMPATIBLE; a failure is
    a finding that blocks T12, not a code-change trigger here).\n\n## Constraints\n\
    - Do NOT edit plan_ensemble.py.\n- Do NOT proceed to mark PASS if any assertion
    fails.\n- Use `--report-dir` as an absolute path (DH caller contract, §8.1).\n\
    \n## Expected Outputs\n- A PASS/FAIL verdict registered as a TN-style verification
    note (no file edit). Register via artifact_register(item_id=2646, artifact_type=\"\
    research\", artifact_id=\"plan-ensemble-verify-dh-workflow-extractor\", content=<verdict
