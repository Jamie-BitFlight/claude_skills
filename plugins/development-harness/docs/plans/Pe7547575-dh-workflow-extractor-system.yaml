- id: T16
  title: Create /dh:workflow-query skill — agent-facing step-graph query 
    interface (4 query patterns + freshness check)
  status: not-started
  agent: plugin-creator:skill-creator
  dependencies:
  - T04
  - T13
  priority: 4
  complexity: medium
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  parallelize-with:
  - T17
  - T18
  accuracy-risk: medium
  reason: Agent query interface (ADR-3). Reads step.json so the bootstrap (T13) 
    and rewritten schema (T04) must exist. Implementable on partial step layer 
    data. Lowest-criticality consumer of the spine.
  body: "## Context\nCreate the agent-facing query skill that reads the step layer
    JSON for blast-radius analysis, component inventory, downstream traversal, and
    coverage gaps. Loaded on demand by agents (not session-injected). This skill does
    NOT exist. Source: architect §4.7, §6 (full spec), ADR-3. Load `/plugin-creator:skill-creator`.\n\
    \n## Objective\nProduce workflow-query/SKILL.md with the §6 frontmatter and the
    4 query-pattern contracts plus the required freshness check.\n\n## Inputs\n- Architect
    spec §6 (frontmatter, 4 query patterns, data sources, freshness check, no-session-injection
    rationale), §4.7 (module boundary)\n- step.json (T13 bootstrap) and rewritten
    graph-schema.md (T04)\n\n## Requirements\n1. Frontmatter per §6: name=workflow-query,
    the specified description, `user-invocable: false`, tools: Read.\n2. Body defines
    the 4 query patterns with their input context and output contracts: (1) Blast-Radius
    (file → affected step nodes, downstream actors, MCP calls, artifacts, gap edges);
    (2) Component inventory (agent/skill → step nodes where actor=component, grouped
    by source); (3) Downstream traversal (start_node → BFS over next/dispatches/defers_to,
    includes gap edges with gap:true); (4) Coverage gap (all verified:false nodes
    + all gap edges).\n3. Data sources read: step.json, dh-workflow-graph.json (enrichment),
    COVERAGE.md (freshness) per §6.\n4. Freshness check (required): before answering,
    read meta.json, compare last_analyzed_commit with current HEAD; if different,
    prefix answer with the §6 stale warning.\n5. No session-start injection (ADR-3
    / anti-instruction-bloat). The skill is loaded on demand only.\n6. Stateless:
    every invocation reads fresh from disk; no MCP calls, no writes (§4.7).\n\n##
    Constraints\n- Do NOT make the skill user-invocable (§6: user-invocable: false).\n\
    - Do NOT add write/MCP operations (§4.7 Does NOT own).\n- Do NOT add session-start
    injection (ADR-3 prohibits).\n- Do NOT grant tools beyond Read.\n\n## Expected
    Outputs\n- `plugins/development-harness/skills/workflow-query/SKILL.md` (new skill)\n\
    \n## Acceptance Criteria\n1. Frontmatter matches §6 (name, description, user-invocable:
    false, tools: Read).\n2. All 4 query patterns are present with the §6 output contracts.\n\
    3. The freshness check (read meta.json, compare HEAD, conditional stale prefix)
