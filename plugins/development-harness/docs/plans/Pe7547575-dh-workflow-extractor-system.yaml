  ### Technical Reference Details

  **Function signatures (enumerate_scope.py):**
  ```python
  def enumerate_scope(
      entry_points: list[str],  # e.g., ['work-backlog-item', 'groom-milestone', ...]
      plugin_root: Path,
      max_depth: int = 15,
  ) -> list[ScopeEntry]: ...

  def extract_references(
      file_path: Path,
      plugin_root: Path,
  ) -> list[ResolvedRef]: ...

  def write_scope_md(
      entries: list[ScopeEntry],
      output_path: Path,
  ) -> None: ...
  ```

  **Data models (enumerate_scope.py):**
  ```python
  @dataclass
  class ScopeEntry:
      file_path: str  # relative to plugin root
      entry_point: str
      reference_type: Literal['mermaid_node', 'skill_invocation', 'agent_dispatch', 'prose_reference']
      depth: int

  @dataclass
  class ResolvedRef:
      file_path: str  # resolved path, relative to plugin root
      reference_type: str
      source_heading: str  # optional, where reference was found
  ```

  **Function signatures (merge_layer.py):**
  ```python
  def merge_fragment(
      layer_path: Path,
      fragment: ExtractionFragment,
  ) -> MergeResult: ...

  def read_layer(layer_path: Path) -> LayerJSON: ...

  def write_layer(layer_path: Path, layer: LayerJSON) -> None: ...
  ```

  **Data models (merge_layer.py):**
  ```python
  @dataclass(frozen=True)
  class ExtractionFragment:
      meta: dict  # {source_file, layer_type, extracted_at, verified_count, unverified_count}
      items: list[dict]  # step/decision nodes with verified=true
      unverified_items: list[dict]  # nodes with verified=false

  @dataclass(frozen=True)
  class MergeResult:
      removed_count: int
      added_count: int
      total_after: int
      layer_path: Path
  ```

  **File locations:**
  - PRD: `plugins/development-harness/docs/plans/prd-workflow-extractor.md` (source of truth for goals, scope, extraction rules, non-goals)
  - Architect spec: `plan/architect-dh-workflow-extractor-system.md` (source of truth for component design, type system, agent specs, ADRs)
  - Extraction rules: `docs/workflow-layers/extraction-rules.json` (9 step-centric groups, input to plan_ensemble.py)
  - Known entities: `docs/workflow-layers/KNOWN_ENTITIES.md` (canonical entity names, maintained by extraction workers)
  - Scope output: `docs/workflow-layers/SCOPE.md` (reachable file list, produced by enumerate_scope.py)
  - Graph layers: `docs/workflow-layers/step.json` (extracted steps, produced by dh-extract-file.js → merge_layer.py)
  - Staleness tracking: `docs/workflow-layers/meta.json` (last-analyzed commit, per-file SHA-256, produced by hook)
  - Misses log: `.tmp/extraction-misses/{date}-{slug}.md` (weight=1 CONFIRMED findings for rule refinement)

  **Domain skills for all tasks:**
  - `python-engineering:python3-typing` — type hints in Python scripts
  - `python-engineering:python3-testing` — pytest fixtures and test patterns
  - `plugin-creator:claude-plugins-reference-2026` — plugin.json schema, agent frontmatter, skill registration

  **Related architect decisions:**
  - Deterministic outer loop (enumerate_scope) + LLM ensemble per file: ensures reproducible scope and incremental updates
  - Haiku workers + sonnet verifier: cost-effective with verified fidelity (evidence-quote grounding required)
  - Fragment storage model: enables idempotent ETL and incremental updates
  - Gap edges: required for correct impact-radius analysis (silent gaps produce wrong blast-radius assessments)
  - Slug-normalised heading keys: minor text variations no longer break deduplication (backward-compat gated)
  - Cross_group signal: findings from ≥2 rule groups elevated in ranking (improves credibility)
  - SessionStart hook for staleness detection: ensures agents always see current graph without manual triggering
  - Agent-facing query skill: shields agents from direct graph access, provides fresh-check semantics

  **Backward compatibility (cross-plugin contract §8):**
  - `reduce.py` changes: slug-normalisation and cross_group flag gated behind version check or feature flag. Existing callers get old behavior; DH passes explicit flag to enable new behavior.
  - `plan_ensemble.py`: no code changes required; DH passes `--window 4` to match 9-group extraction-rules.json layout.
  - Graph format: new step nodes added; old decision nodes retained. Both coexist in same layer JSON files.

  **Query skill patterns (/dh:workflow-query):**
  1. Find steps/nodes by actor or source file — e.g., "all steps performed by @dh:impact-analyst" or "all nodes extracted from groom/swarm.md"
  2. Affected nodes when source file changes — e.g., "if groom/swarm.md changes, what other nodes depend on it?"
  3. Artifact dependencies — e.g., "what steps read the impact-radius artifact?"
  4. Dispatch topology — e.g., "what team composition does this skill dispatch?"
  All patterns include freshness check: compares graph timestamp against HEAD; if stale, returns `freshness: false`.
