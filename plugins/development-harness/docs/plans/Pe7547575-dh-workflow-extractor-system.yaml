tasks:
- id: T01
  title: Create scripts/enumerate_scope.py — deterministic BFS scope crawl 
    producing SCOPE.md
  status: not-started
  agent: python-engineering:python-cli-architect
  priority: 1
  complexity: high
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  parallelize-with:
  - T02
  accuracy-risk: medium
  reason: Root of the dependency spine. SCOPE.md is the contract consumed by the
    SessionStart hook and the extraction pipeline. Deterministic — no LLM, no 
    hallucination risk (ADR-1).
  body: "## Context\nNew producer for the DH Workflow Extractor System. Performs deterministic
    BFS from entry-point SKILL.md files to compute the full in-scope file set. Source:
    architect spec plan/architect-dh-workflow-extractor-system.md §1.1, §2.1, §2.9,
    §3.3, §4.1, ADR-1. This file does NOT exist yet (Codebase Audit: must create).\n\
    \n## Objective\nProduce a deterministic `enumerate_scope.py` that crawls entry
    points, resolves 4 reference types, and writes `docs/workflow-layers/SCOPE.md`
    — one row per reachable file, stable output for identical input.\n\n## Inputs\n\
    - Architect spec §1.1 (enumerate_scope.py interface), §2.1 (ScopeEntry / _RawScopeRow),
    §2.9 (ResolvedRef), §3.3 (SCOPE.md format), §4.1 (module boundary)\n- Entry point
    skill names (hardcoded constants): work-backlog-item, groom-milestone, work-milestone,
    complete-milestone, create-milestone, start-milestone, group-items-to-milestone\n\
    - plugin_root resolved from CLAUDE_PLUGIN_ROOT env var or CWD\n\n## Requirements\n\
    1. Implement `enumerate_scope(entry_points: list[Path], plugin_root: Path, max_depth:
    int = 15) -> list[ScopeEntry]` per the §1.1 signature.\n2. Implement `extract_references(file_path:
    Path, plugin_root: Path) -> list[ResolvedRef]` detecting the 4 reference patterns
    in §1.1: Mermaid node label containing `.md` path (resolve relative to referencing
    file dir); `/dh:skill-name` or `Skill(skill='dh:...')` → `skills/skill-name/SKILL.md`;
    `subagent_type=\"dh:agent-name\"` → `agents/agent-name.md`; prose `Load X.md`
    / `Read references/...` (resolve relative path).\n3. Implement `write_scope_md(entries:
    list[ScopeEntry], output_path: Path) -> None` writing the §3.3 markdown table
    (columns: file_path, entry_point, reference_type, depth) with the header block.\n\
    4. BFS visits each file at most once; stops at max_depth=15 (BFS depth, not file
    count).\n5. Unresolvable reference paths are logged as warnings (use logging),
    never raised as exceptions.\n6. Python 3.11+ stdlib-only. Use frozen dataclass
    with slots for ScopeEntry and ResolvedRef per §2.1, §2.9. No `Any` in internal
    code; `Any` only at parse boundary with immediate narrowing.\n7. Declare runtime
    deps (if any beyond stdlib) in PEP 723 inline metadata; if stdlib-only, state
    so in a comment.\n\n## Constraints\n- Do NOT perform any extraction logic, write
    any layer JSON, or make any LLM calls — that is owned by other modules (§4.1 Does
    NOT own).\n- Do NOT hardcode column positions when reading; SCOPE.md consumers
    use the header row. (Producer side: emit a stable header.)\n- Do NOT edit reduce.py,
    plan_ensemble.py, or any cross-plugin file.\n\n## Expected Outputs\n- `plugins/development-harness/scripts/enumerate_scope.py`
    (new file)\n\n## Acceptance Criteria\n1. `enumerate_scope.py` exposes the three
    functions with the exact §1.1 signatures.\n2. Running the script against the real
    DH plugin produces `docs/workflow-layers/SCOPE.md` with ≥1 row per entry point
    and the §3.3 header block present.\n3. All 4 reference types appear in `reference_type`
    column values across the real output (or a warning explains any type with zero
    matches).\n4. BFS terminates: a circular reference chain longer than 15 does not
    produce more than 16 depth levels.\n5. An unresolvable reference produces a logged
    warning and does not raise.\n6. `uv run ty check plugins/development-harness/scripts/enumerate_scope.py`
    exits 0.\n7. `uv run prek run --files plugins/development-harness/scripts/enumerate_scope.py`
    exits 0.\n\n## Verification Steps\n1. `uv run --script plugins/development-harness/scripts/enumerate_scope.py`
    (or invoke main) and confirm SCOPE.md is written with the header block and a populated
    table.\n2. `uv run ty check plugins/development-harness/scripts/enumerate_scope.py`
    — expect exit 0.\n3. `uv run prek run --files plugins/development-harness/scripts/enumerate_scope.py`
    — expect exit 0.\n4. Run: `git add plugins/development-harness/scripts/enumerate_scope.py`
    then `git commit -m \"feat(workflow-extractor): add enumerate_scope.py deterministic
    scope crawl\"`\n\n## Handoff\nReturn: file path, SCOPE.md row count, list of reference_type
    values observed, ty/prek results, and confirmation that PEP 723 deps (if any)
    must be mirrored to pyproject.toml in T15."
  handoff: |-
    Report SCOPE.md path, row count, and that all 4 reference types resolve. Confirm PEP 723 deps mirrored to pyproject.toml task T15.
- id: T02
  title: Create scripts/merge_layer.py — idempotent fragment→layer ETL with 
    atomic writes and missing-file bootstrap
  status: not-started
  agent: python-engineering:python-cli-architect
  priority: 1
  complexity: high
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  parallelize-with:
  - T01
  accuracy-risk: medium
  reason: Root of the dependency spine. The idempotent ETL that turns per-file 
    extraction fragments into the step layer JSON. Required before 
    dh-extract-file.js step 5 can run (ADR-1, §4.2).
  body: "## Context\nNew producer for the DH Workflow Extractor System. Performs the
    idempotent fragment→layer ETL: removes prior nodes from the same source file,
    appends new verified nodes, writes atomically. Source: architect spec §1.1, §2.4,
    §2.5, §2.10, §3.1, §3.4, §4.2. This file does NOT exist yet (Codebase Audit: must
    create).\n\nNOTE (bootstrap gap resolution): §3.1 names step.json the primary
    new layer file but no task pre-creates it. This task owns the missing-file bootstrap:
    when the layer path does not exist, merge_layer creates it with an empty `{meta,
    nodes, edges}` structure before merging. This satisfies the test in §9.2.4 without
    a separate bootstrap step.\n\n## Objective\nProduce a deterministic, idempotent
    `merge_layer.py` that merges an ExtractionFragment into a layer JSON file atomically,
    isolating changes to the fragment's source_file, and bootstrapping the layer file
    if absent.\n\n## Inputs\n- Architect spec §1.1 (merge_layer interface + MergeResult),
    §2.4 (ExtractionFragment), §2.5 (LayerJSON), §2.10 (MergeResult), §3.1 (step.json
    data model), §3.4 (fragment intermediate), §4.2 (module boundary + idempotency
    invariant)\n\n## Requirements\n1. Implement `merge_fragment(layer_path: Path,
    fragment: ExtractionFragment) -> MergeResult`, `read_layer(layer_path: Path) ->
    LayerJSON`, `write_layer(layer_path: Path, layer: LayerJSON) -> None` per §1.1.\n\
    2. Idempotency: `merge_fragment(layer, fragment)` produces identical output when
    applied twice (§4.2 invariant). Achieve by removing all existing nodes whose `source_file`
    matches the fragment's source_file before appending the fragment's items.\n3.
    Atomicity: write to a `.tmp` path then `os.replace()` to the final path — never
    leave a partial write (§1.1 contract).\n4. Source isolation: merging a fragment
    for file A must not remove or alter nodes from file B (§4.2 contract, §9.2.2).\n\
    5. Missing-file bootstrap: if `layer_path` does not exist, create it with `{\"\
    meta\": {...}, \"nodes\": [], \"edges\": []}` then merge (resolves §9.2.4).\n\
    6. Path matching: the fragment's `meta.source_file` is matched against the `source_file`
    field of existing layer nodes. Mismatched paths produce a no-op removal (caller
    normalises paths — document this in a docstring per §4.2 contract).\n7. Use frozen
    dataclasses with slots for ExtractionFragment and MergeResult per §2.4, §2.10.
    LayerJSON is a mutable @dataclass per §2.5. Python 3.11+ stdlib-only, no `Any`
    in internal code.\n8. Implement `parse_extraction_fragment` (§2.4) and `parse_layer_json`
    (§2.5) boundary parsers.\n9. JSON written without indentation (machine-readable;
    repo rule: `json.dumps(data)` not `indent=N`).\n\n## Constraints\n- Do NOT generate
    fragments (owned by dh-extract-file.js / reducer agent).\n- Do NOT write meta.json
    (owned by the hook — §4.2 Does NOT own).\n- Do NOT perform graph assembly.\n-
    Do NOT call os.replace before the .tmp write succeeds.\n\n## Expected Outputs\n\
    - `plugins/development-harness/scripts/merge_layer.py` (new file)\n\n## Acceptance
    Criteria\n1. `merge_fragment` is idempotent: applying the same fragment twice
    yields byte-identical layer file content (§9.2.1).\n2. Merging a fragment for
    source A leaves nodes from source B unchanged (§9.2.2 source isolation).\n3. A
    simulated `os.replace` failure leaves the original layer file byte-identical (§9.2.3
    atomicity).\n4. Merging into an absent layer_path creates the file and returns
    removed_count=0 (§9.2.4 bootstrap).\n5. MergeResult carries removed_count, added_count,
    total_after, layer_path per §2.10.\n6. `uv run ty check plugins/development-harness/scripts/merge_layer.py`
    exits 0.\n7. `uv run prek run --files plugins/development-harness/scripts/merge_layer.py`
    exits 0.\n\n## CoVe Checks\n- Key claims to verify:\n  - Idempotency holds for
    fragments containing both items and unverified_items.\n  - Atomic write never
    corrupts the existing file on failure.\n- Verification questions:\n  1. After
    two identical merges, does `read_layer` return the same node set and same total_after?\n\
    \  2. If `os.replace` raises, is the pre-merge content still present and parseable?\n\
    \  3. Does removing nodes by source_file accidentally remove edges referencing
    surviving nodes?\n- Evidence to collect: outputs of the §9.2.1–9.2.4 tests (written
    in T03), ty/prek exit codes.\n- Revision rule: if any idempotency/atomicity check
    fails, fix and re-run before marking complete.\n\n## Verification Steps\n1. Run
    the merge_layer test module (authored in T03) and confirm idempotency, isolation,
    atomicity, and bootstrap tests pass.\n2. `uv run ty check plugins/development-harness/scripts/merge_layer.py`
    — expect exit 0.\n3. `uv run prek run --files plugins/development-harness/scripts/merge_layer.py`
    — expect exit 0.\n4. Run: `git add plugins/development-harness/scripts/merge_layer.py`
    then `git commit -m \"feat(workflow-extractor): add merge_layer.py idempotent
    fragment ETL\"`\n\n## Handoff\nReturn: file path, idempotency/atomicity confirmation,
    bootstrap behaviour confirmation, ty/prek results, and PEP 723 deps to mirror
    in T15."
  handoff: |-
    Report file path, the idempotency invariant test outcome, and confirm missing-layer-file bootstrap behaviour (creates step.json with empty nodes/edges).
- id: T03
  title: Write tests/test_enumerate_scope.py and tests/test_merge_layer.py
  status: not-started
  agent: python-engineering:python-pytest-architect
  dependencies:
  - T01
  - T02
  priority: 2
  complexity: medium
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  accuracy-risk: low
  reason: 'Test-authorship independence (CLAUDE.md): the agent implementing the scripts
    must not author their tests. Architect §9.1 and §9.2 supply the exact test bodies
    to implement against the desired behaviour.'
  body: "## Context\nTest tasks for enumerate_scope.py (T01) and merge_layer.py (T02).
    Written independently of the implementation per the CLAUDE.md test-authorship-independence
    rule. The architect spec §9.1 and §9.2 provide concrete test bodies (fixtures,
    parametrize cases, assertions) — implement against those.\n\n## Objective\nProduce
    two pytest modules that verify enumerate_scope BFS correctness/termination/reference-type
    detection and merge_layer idempotency/isolation/atomicity/bootstrap, authored
    against the spec's desired behaviour (not the implementation).\n\n## Inputs\n\
    - Architect spec §9.1 (test_enumerate_scope.py: mock_plugin fixture, traversal-finds-all,
    no-revisit, max-depth termination, reference-type parametrize, unresolvable-no-crash)\n\
    - Architect spec §9.2 (test_merge_layer.py: idempotency, source isolation, atomicity
    via monkeypatched os.replace, empty-layer bootstrap)\n- The implemented modules
    from T01, T02\n\n## Requirements\n1. Create `tests/test_enumerate_scope.py` implementing
    all §9.1 cases: 9.1.1 traversal correctness + no-revisit, 9.1.2 depth-15 termination,
    9.1.3 each reference type (parametrized over the 4 patterns), 9.1.4 unresolvable-path-logged-not-raised.\n\
    2. Create `tests/test_merge_layer.py` implementing all §9.2 cases: 9.2.1 idempotency,
    9.2.2 source isolation, 9.2.3 atomicity (monkeypatch os.replace to raise OSError),
    9.2.4 empty/missing-layer bootstrap.\n3. Use `tmp_path` fixtures; build synthetic
    plugin trees as in §9.1.1. No reliance on real repo files.\n4. Follow repo pytest
    conventions: snake_case names, AAA structure, behavioural test names.\n5. Coverage
    target: 90% for the critical paths (merge idempotency, scope traversal correctness)
    per §9 intro.\n\n## Constraints\n- Do NOT modify enumerate_scope.py or merge_layer.py.
    If a test reveals a behaviour gap, report it as a finding for the implementing
    task to fix — do not silently edit the implementation.\n- Do NOT use synthetic
    mocks where the spec specifies real file-tree fixtures.\n\n## Expected Outputs\n\
    - `tests/test_enumerate_scope.py` (new file)\n- `tests/test_merge_layer.py` (new
    file)\n\n## Acceptance Criteria\n1. `uv run pytest tests/test_enumerate_scope.py`
    passes all §9.1 cases.\n2. `uv run pytest tests/test_merge_layer.py` passes all
    §9.2 cases (idempotency, isolation, atomicity, bootstrap).\n3. The 4 reference
    types are each covered by a distinct parametrize case (§9.1.3).\n4. Atomicity
    test monkeypatches os.replace to raise and asserts the original file is intact
    (§9.2.3).\n5. `uv run prek run --files tests/test_enumerate_scope.py tests/test_merge_layer.py`
    exits 0.\n\n## Verification Steps\n1. `uv run pytest tests/test_enumerate_scope.py
    tests/test_merge_layer.py -v` — expect all pass.\n2. `uv run prek run --files
    tests/test_enumerate_scope.py tests/test_merge_layer.py` — expect exit 0.\n3.
    Run: `git add tests/test_enumerate_scope.py tests/test_merge_layer.py` then `git
    commit -m \"test(workflow-extractor): add enumerate_scope and merge_layer tests\"\
    `\n\n## Handoff\nReturn: both file paths, pass/fail counts, coverage on critical
    paths, and any spec-vs-impl behaviour gaps discovered (as findings, not silent
    fixes)."
  handoff: |-
    Report both test file paths, pass/fail counts, and any behaviour gaps found between spec and implementation (report as findings, do not patch impl silently).
- id: T04
  title: Rewrite docs/graph-schema.md to match the PRD/architect data model (no 
    old step schema retained)
  status: not-started
  agent: dh:service-docs-maintainer
  priority: 2
  complexity: medium
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  parallelize-with:
  - T05
  - T06
  accuracy-risk: high
  reason: 'Schema is the contract for the step layer JSON. Architect concern: the
    rewrite must NOT retain the old step schema — it is incompatible with the PRD
    schema. Must precede creating step layer JSON files.'
  body: "## Context\nThe DH workflow graph schema doc must be rewritten to match the
    new data model in the architect spec §3 (step.json, gap edges, node ID convention,
    verified-flag semantics) and §2 (type system). Architect concern (explicit): the
    rewrite must NOT retain the old step schema — it is incompatible with the PRD
    schema. Source: architect §1.2 content-only updates table, §3.1–3.5.\n\n## Objective\n\
    Replace docs/graph-schema.md so it documents exactly the new data model: step
    node shape (§2.2 / §3.1), gap edge shape (§2.3), next/triggered_by edge types,
    node ID convention, verified-flag semantics, meta.json, SCOPE.md, fragment, and
    miss-log formats — with zero residue of the prior incompatible step schema.\n\n\
    ## Inputs\n- Architect spec §2 (Type System), §3 (Data Model — step.json, meta.json,
    SCOPE.md, fragment, miss log)\n- Current `plugins/development-harness/docs/graph-schema.md`
    (to identify and remove the old step schema)\n\n## Requirements\n1. Document the
    step node schema exactly per §3.1 / §2.2 (_RawStepNode fields: id, type, label,
    actor, source_file, source_heading, verified, conditional, condition, mcp_calls,
    reads_artifacts, writes_artifacts, dispatches, metadata).\n2. Document the gap
    edge schema per §2.3 / §3.1 (type=gap, verified=false, gap=true, source/target,
    source_file, source_heading) and the `next` edge type.\n3. Document the node ID
    convention: `step.{route}.{reference-file-slug}.{actor-slug}.{action-slug}` (lowercase,
    hyphens→dots, special chars stripped).\n4. Document verified-flag semantics (true
    = sonnet CONFIRMED with ≥80% evidence match; false = PLAUSIBLE or weight-1).\n\
    5. Document meta.json (§3.2), SCOPE.md (§3.3), fragment (§3.4), and miss-log (§3.5)
    formats.\n6. Remove ALL content describing the prior/incompatible step schema.
    The rewrite replaces, it does not append.\n7. Follow repo markdown standards:
    language-fenced code blocks, `./` relative links, blank lines around fences.\n\
    \n## Constraints\n- Do NOT retain any field, example, or description from the
    old step schema that conflicts with §3.1.\n- Do NOT invent fields not present
    in §2/§3.\n- Do NOT add derived counts (repo No-Derived-Data rule).\n\n## Expected
    Outputs\n- `plugins/development-harness/docs/graph-schema.md` (rewritten)\n\n\
    ## Acceptance Criteria\n1. graph-schema.md documents step node, gap edge, and
    next edge exactly matching §2.2/§2.3/§3.1 field names.\n2. The node ID convention
    and verified-flag semantics from §3.1 are present.\n3. meta.json, SCOPE.md, fragment,
    and miss-log formats are documented per §3.2–3.5.\n4. No old step-schema markers
    remain: a grep for the prior schema's distinctive field names/markers returns
    zero matches (identify those markers from the current file before rewriting and
    list them in the handoff).\n5. `uv run prek run --files plugins/development-harness/docs/graph-schema.md`
    exits 0.\n\n## CoVe Checks\n- Key claims to verify:\n  - Every documented field
    name matches the architect spec §2/§3 exactly (no drift).\n  - No prior-schema
    field survives the rewrite.\n- Verification questions:\n  1. Does each field name
    in the doc appear verbatim in §2.2/§2.3/§3.1?\n  2. Does a grep for the old schema's
    distinctive markers (enumerated before rewrite) return zero?\n  3. Are gap edges
    documented as type=gap with verified=false (not omitted)?\n- Evidence to collect:
    the list of old-schema markers grepped (before/after), the diff between old and
    new field sets.\n- Revision rule: if any old-schema marker remains or any field
    name drifts from the spec, revise before completing.\n\n## Verification Steps\n\
    1. Before rewriting: grep the current graph-schema.md for old step-schema field
    names; record them.\n2. After rewriting: re-run the same grep; expect zero matches.\n\
    3. `uv run prek run --files plugins/development-harness/docs/graph-schema.md`
    — expect exit 0.\n4. Run: `git add plugins/development-harness/docs/graph-schema.md`
    then `git commit -m \"docs(workflow-extractor): rewrite graph-schema.md for new
    step data model\"`\n\n## Handoff\nReturn: file path, the list of old-schema markers
    removed, before/after grep counts, prek result."
  handoff: |-
    Report the file path and confirm (via grep) that no old/incompatible step-schema markers remain.
- id: T05
  title: Replace docs/workflow-layers/extraction-rules.json with 9 step-centric 
    rule groups
  status: not-started
  agent: dh:service-docs-maintainer
  priority: 2
  complexity: medium
  skills:
  - python-engineering:python3-typing
  - python-engineering:python3-testing
  - plugin-creator:claude-plugins-reference-2026
  parallelize-with:
  - T04
  - T06
  accuracy-risk: medium
  reason: extraction-rules.json is plan_ensemble.py input and the rule source 
    the worker agent applies. Must precede workflow-extractor-worker.md (T07) 
    which reads the rules, and is consumed by the plan_ensemble verification 
    gate.
  body: "## Context\nReplace the 6 fork-centric extraction rules with the 9 step-centric
    rule groups defined verbatim in architect spec §1.2 (extraction-rules.json new
    format). This file is the input to plan_ensemble.py and the rule source the haiku
    worker applies. Source: architect §1.2, §4.8, §8.1 (window=4 expects exactly 9
    groups).\n\n## Objective\nProduce extraction-rules.json containing exactly the
    9 step-centric groups (keys \"1\"–\"9\") from §1.2, valid as plan_ensemble.py
    input.\n\n## Inputs\n- Architect spec §1.2 (the literal 9-group JSON), §4.8 (inter-module
    contract: keys 1-9, each non-empty list[str]), §8.1 (window=4, 9 workers)\n- Current
    `plugins/development-harness/docs/workflow-layers/extraction-rules.json` (6 fork
    rules to replace)\n\n## Requirements\n1. Write the 9 groups exactly as specified
    in §1.2: (1) numbered/bulleted steps with actor+action; (2) conditional guards;
    (3) artifact reads; (4) artifact writes; (5) agent dispatch; (6) file-reference
    expansion; (7) skill invocations; (8) MCP tool calls full+short form; (9) actor
    topology.\n2. JSON object with string keys \"1\"–\"9\", each mapping to a non-empty
    `list[str]` (§4.8 contract).\n3. Remove all 6 prior fork-centric rules — this
    is a replacement.\n4. JSON without indentation per repo rule (machine-readable
    consumer plan_ensemble.py).\n\n## Constraints\n- Do NOT keep any of the 6 old
    fork rules.\n- Do NOT add a 10th group or rename keys — plan_ensemble.py with
    window=4 expects exactly 9 groups (§8.1).\n- Do NOT alter plan_ensemble.py.\n\n\
    ## Expected Outputs\n- `plugins/development-harness/docs/workflow-layers/extraction-rules.json`
    (replaced)\n\n## Acceptance Criteria\n1. The file is a JSON object with exactly
    keys \"1\" through \"9\", each a non-empty list of strings.\n2. The group contents
    match §1.2 (step-centric, not fork-centric).\n3. `python3 -c \"import json; d=json.load(open('plugins/development-harness/docs/workflow-layers/extraction-rules.json'));
    assert set(d)=={str(i) for i in range(1,10)}; assert all(isinstance(v,list) and
    v for v in d.values())\"` exits 0.\n4. `uv run prek run --files plugins/development-harness/docs/workflow-layers/extraction-rules.json`
    exits 0.\n\n## Verification Steps\n1. Run the python3 assertion in AC3 — expect
    exit 0.\n2. `uv run prek run --files plugins/development-harness/docs/workflow-layers/extraction-rules.json`
    — expect exit 0.\n3. Run: `git add plugins/development-harness/docs/workflow-layers/extraction-rules.json`
    then `git commit -m \"feat(workflow-extractor): replace fork rules with 9 step-centric
    groups\"`\n\n## Handoff\nReturn: file path, the AC3 assertion result, prek result,
    and confirmation that 9 groups are present (feeds the T11 plan_ensemble verification
    gate)."
  handoff: |-
    Report file path and confirm the JSON validates as plan_ensemble.py input (object with keys 1-9, each a non-empty list[str]).
- id: T06
  title: Update docs/workflow-layers/KNOWN_ENTITIES.md — retire 
