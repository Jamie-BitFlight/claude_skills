    before coding. Resolve ENSEMBLE_SCRIPTS_DIR via §8.1 strategy 2 (explicit DH_ENSEMBLE_SCRIPTS_DIR
    env var populated by the hook) preferred over strategy 1 (relative `${CLAUDE_PLUGIN_ROOT}/../plugin-creator/...`).
