# Status legend: every clause starts 'pending' and is updated only by the
# assigned partition auditor upon evidence collection.
status_legend:
  pending: no evidence collected yet
  in_progress: auditor actively collecting evidence
  evidenced: at least one evidence method resolved; findings recorded separately
  blocked: missing observable or unavailable environment; reason recorded
