# Purpose Audit — Clause/Evidence Manifest
# Atomic mapping of every PURPOSE.md clause to selected sources, evidence
# methods, and audit partitions. Consumed by fresh fidelity auditors.
# Generated from the frozen reference manifest; no findings or remediation.

manifest_version: 1
manifest_type: purpose-audit-clause-evidence-manifest

baseline:
  commit: 2c76f47da69117724d619e364fa4b968e83e944d
  purpose_doc: plugins/development-harness/docs/PURPOSE.md
  purpose_doc_read: complete
  reference_manifest: plugins/development-harness/docs/audits/purpose-audit-reference-manifest.yaml
  reference_manifest_read: complete
  frozen: true
  worktree_state_at_freeze: clean

# Source precedence inherited from the reference manifest.
source_precedence:
  - PURPOSE.md target contract clauses
  - PURPOSE.md current-boundary clauses
  - executable protocols, configuration, transport, and provider implementations
  - published plugin, lifecycle, and skill contracts
  - focused parity, conformance, and transport tests
  - supporting ADRs and agent procedures

# Evidence schema: every auditor finding must classify each assertion.
evidence_schema:
  documented-claim: >-
    A statement of intent or contract found in docs, skills, ADRs, or agent
    prompts. Proves what the system declares, not what it does.
  implementation-fact: >-
    A structural property observable in committed source: a class, function,
    field, import, registration, or configuration value. Proves existence/shape,
    not runtime behavior.
  test-evidence: >-
    A focused, executable test that asserts specific behavior against an
    isolated backend. Proves expected behavior under test conditions, not all
    real runtime configurations.
  confidence: >-
    Auditor's confidence level for a resolved assertion: high / medium / low.
    High = multiple independent evidence types agree; low = single weak signal.
  unknown: >-
    An assertion the auditor could not resolve to source, test, or runtime
    proof. Must state the missing observable or unavailable environment — not
    mere lack of effort. Never inferred.

# Audit safety: read-only, no external writes, no --help as proof.
audit_safety:
  mode: read-only
  backlog_backend_default: memory
  task_backend_default: memory
  sqlite_allowed: true
  external_writes: prohibited
  network_writes: prohibited
  gist_writes: prohibited
  github_writes: prohibited
  state_root_isolation: required
  help_output_as_proof: prohibited
  import_as_proof: prohibited
  mock_as_proof: prohibited
  runtime_proof_requirements: >-
    Any runtime claim must record exact command, environment variables, backend
    selection, fixture/state root, exit status, response body, and timestamp.
    Run in isolated local/memory configurations unless a deliberately approved
    live-provider test is necessary.

# Audit partitions: independent auditors own one partition; may cite another
# but cannot claim its behavior without marking it dependent/unknown.
audit_partitions:
  A:
    name: public-docs-skills-readme-cli
    scope: >-
      Public docs, skills, README, plugin manifest, CLI transport surface,
      and published contract claims. Owns the public-surface inventory and
      documented-intent evidence.
    clauses: [P1, P4, P5, B1]
  B:
    name: backlog-logical-objects-providers
    scope: >-
      Backlog logical objects, backend protocols, provider selection, and
      cross-provider conformance. Owns the canonical model and provider-
      neutrality evidence for backlog storage.
    clauses: [P2, P6, B3]
  C:
    name: sam-plans-tasks-coordination
    scope: >-
      SAM plan/task lifecycle, coordination/dispatch, task backend contract,
      and the closed-loop workflow stages. Owns lifecycle and coordination
      evidence.
    clauses: [P3]
  D:
    name: artifacts-durability-cross-surface-integration
    scope: >-
      Artifact manifests/content storage, durability guarantees (Gist vs
      local), fallback behavior, backlog persistence boundary, and cross-
      surface integration (CLI+MCP+backend end-to-end). Owns durability and
      integration evidence.
    clauses: [B2, B4]

